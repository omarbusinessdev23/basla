  /* The coach's dashboard, in Velmo's own look: the warm ground, glass cards, near-black ink, one dark button. */
  :root {
    --bg: #E7E2D9; --glow: rgba(255, 255, 255, .72); --ink: rgba(16, 18, 24, .94); --muted: rgba(16, 18, 24, .62);
    --line: rgba(16, 18, 24, .1); --card: rgba(255, 255, 255, .58); --edge: rgba(255, 255, 255, .92);
    --well: rgba(16, 18, 24, .055); --well-press: rgba(16, 18, 24, .1); --accent: #14161C; --on-accent: #FFFFFF;
    --shadow: 0 1px 2px rgba(16, 18, 24, .05), 0 18px 40px -28px rgba(16, 18, 24, .3); --error: #A3261E; --good: #1E8A47;
    --quint: cubic-bezier(.22, 1, .36, 1);
    --display: "Cal Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #090A0E; --glow: rgba(255, 255, 255, .08); --ink: rgba(255, 255, 255, .96);
      --muted: rgba(255, 255, 255, .64); --line: rgba(255, 255, 255, .12); --card: rgba(255, 255, 255, .06);
      --edge: rgba(255, 255, 255, .14); --well: rgba(255, 255, 255, .08); --well-press: rgba(255, 255, 255, .14);
      --accent: #FFFFFF; --on-accent: #14161C; --shadow: none; --error: #FF8A7A; --good: #3DDC84; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #090A0E; --glow: rgba(255, 255, 255, .08); --ink: rgba(255, 255, 255, .96);
    --muted: rgba(255, 255, 255, .64); --line: rgba(255, 255, 255, .12); --card: rgba(255, 255, 255, .06);
    --edge: rgba(255, 255, 255, .14); --well: rgba(255, 255, 255, .08); --well-press: rgba(255, 255, 255, .14);
    --accent: #FFFFFF; --on-accent: #14161C; --shadow: none; --error: #FF8A7A; --good: #3DDC84; color-scheme: dark; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; font-synthesis: none; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(110% 60% at 30% -10%, var(--glow), transparent 66%); }
  ::selection { background: var(--accent); color: var(--on-accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  p { margin: 0; }
  .muted { color: var(--muted); }

  /* Shell: the clients down the side, the open client beside them */
  #app { position: relative; display: grid; grid-template-columns: 304px minmax(0, 1fr); height: 100vh; height: 100dvh; }
  .side { display: flex; flex-direction: column; min-height: 0; padding: 22px 14px 16px; border-inline-end: 1px solid var(--line); }
  .lockup { display: flex; align-items: baseline; padding: 2px 10px 0; font-family: var(--display); font-size: 23px;
    letter-spacing: -.01em; white-space: nowrap; }
  .lockup svg { width: .78em; height: .74em; margin-inline-end: -.03em; fill: currentColor; flex: none; }
  .side h2 { margin: 26px 10px 8px; display: flex; justify-content: space-between; }
  h2 { margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
  .roster { flex: 1; min-height: 0; overflow-y: auto; margin: 0; padding: 0 0 8px; list-style: none; scrollbar-width: thin; }
  .who { width: 100%; text-align: start; padding: 11px 12px; border-radius: 14px; display: grid;
    grid-template-columns: minmax(0, 1fr) auto; gap: 1px 10px; align-items: baseline;
    transition: background .18s ease, color .18s ease, transform .12s var(--quint); }
  .who:hover { background: var(--well); }
  .who:active { transform: scale(.985); }
  .who b { font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who .kg { font-size: 14px; font-variant-numeric: tabular-nums; }
  .who .sub { grid-column: 1 / -1; font-size: 13px; color: var(--muted); }
  .who[aria-current="true"] { background: var(--accent); color: var(--on-accent); }
  .who[aria-current="true"] .sub { color: inherit; opacity: .7; }
  .side .foot { display: grid; gap: 8px; padding: 12px 4px 0; border-top: 1px solid var(--line); }
  .state { min-height: 18px; padding: 0 8px; font-size: 13px; color: var(--muted); }
  .state.bad { color: var(--error); }

  .btn { min-height: 44px; padding: 0 18px; border-radius: 22px; background: var(--accent); color: var(--on-accent);
    font-family: var(--display); font-size: 16px; letter-spacing: .01em; display: inline-flex; align-items: center;
    justify-content: center; gap: 8px; text-decoration: none; transition: transform .12s var(--quint), opacity .2s ease; }
  .btn:active { transform: scale(.975); }
  .btn.quiet { background: var(--well); color: var(--ink); }
  .btn:disabled { opacity: .45; cursor: default; }
  .btn[hidden] { display: none; }

  .main { min-width: 0; height: 100%; overflow-y: auto; padding: 26px clamp(18px, 3vw, 44px) 80px; }
  .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 22px; }
  .back { display: none; width: 44px; height: 44px; border-radius: 50%; place-items: center; background: var(--well); }
  .back svg { width: 20px; height: 20px; }
  .name { flex: 1; min-width: 200px; background: none; border: 0; padding: 0; outline: none; font-family: var(--display);
    font-size: clamp(30px, 3.4vw, 44px); line-height: 1.05; letter-spacing: -.02em; caret-color: var(--accent); }
  .name::placeholder { color: var(--muted); opacity: .8; }
  .head .tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; align-items: start; }
  .card { grid-column: span 12; padding: 20px 22px 22px; border-radius: 24px; background: var(--card);
    box-shadow: inset 0 0 0 1px var(--edge), var(--shadow); }
  .card > h2 { margin-bottom: 14px; display: flex; justify-content: space-between; gap: 12px; }
  @media (min-width: 1240px) { .card.half { grid-column: span 6; } .card.third { grid-column: span 4; }
    .card.wide { grid-column: span 8; } }

  .big { font-family: var(--display); font-size: 68px; line-height: 1; letter-spacing: -.03em; }
  .big span { font-family: var(--font); font-size: 16px; color: var(--muted); letter-spacing: 0; margin-inline-start: 8px; }
  .trio { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 18px; }
  .trio div { padding: 12px 14px; border-radius: 16px; background: var(--well); }
  .trio b { display: block; font-family: var(--display); font-size: 24px; font-weight: 400; }
  .trio span { font-size: 13px; color: var(--muted); }
  .rows { margin: 16px 0 0; padding: 0; list-style: none; }
  .rows li { display: flex; justify-content: space-between; gap: 16px; padding: 8px 0; }
  .rows li + li { border-top: 1px solid var(--line); }
  .rows li b { font-weight: 600; font-variant-numeric: tabular-nums; }
  .note { margin-top: 12px; font-size: 14px; }
  .need { font-family: var(--display); font-size: 21px; line-height: 1.25; text-wrap: pretty; }

  .inline { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .inp { height: 44px; padding: 0 14px; border-radius: 14px; background: var(--well); border: 0; outline: none;
    font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; }
  .inp:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  textarea.inp { height: auto; min-height: 110px; padding: 12px 14px; width: 100%; resize: vertical; font-weight: 500; }
  .inp.w { width: 104px; }
  .spark { display: block; width: 100%; height: 72px; margin: 16px 0 4px; overflow: visible; }
  .spark path { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
  .spark circle { fill: var(--accent); }

  .fields { display: grid; grid-template-columns: 1fr; gap: 0 28px; }
  @media (min-width: 760px) { .fields.two { grid-template-columns: 1fr 1fr; } }
  .field { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 14px; align-items: center; padding: 9px 0;
    border-top: 1px solid var(--line); min-height: 58px; }
  .field .lab { font-weight: 500; }
  .field .hint { grid-column: 1 / -1; font-size: 13px; color: var(--muted); margin-top: -2px; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .pill { min-height: 36px; padding: 0 13px; border-radius: 18px; background: var(--well); font-size: 14px; font-weight: 600;
    transition: background .16s ease, color .16s ease, transform .12s var(--quint); }
  .pill:active { transform: scale(.95); }
  .pill[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }

  /* What he answered, in plain words */
  .answers { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
  .answer { padding: 12px 14px; border-radius: 16px; background: var(--well); }
  .answer span { display: block; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .answer b { display: block; margin-top: 3px; font-weight: 600; text-wrap: pretty; }
  .answer.loud { background: var(--accent); color: var(--on-accent); }
  .answer.loud span { color: inherit; opacity: .7; }
  .answer.loud b { font-family: var(--display); font-size: 19px; font-weight: 400; }

  /* Meal plan */
  .meals { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 16px; }
  .meal { padding: 14px 16px; border-radius: 18px; background: var(--well); }
  .meal h3 { margin: 0 0 6px; font-family: var(--display); font-size: 18px; font-weight: 400; display: flex;
    justify-content: space-between; gap: 10px; align-items: baseline; }
  .meal h3 span { font-family: var(--font); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .kind { width: 100%; text-align: start; display: grid; grid-template-columns: 62px minmax(0, 1fr) 16px; gap: 8px; padding: 8px 0;
    align-items: start; font-size: 14px; border-top: 1px solid var(--line); }
  .kind:hover { opacity: .75; }
  .kind .k { color: var(--muted); }
  .kind .v b { font-weight: 700; font-variant-numeric: tabular-nums; }
  .kind .v i { font-style: normal; color: var(--muted); }
  .kind svg { width: 15px; height: 15px; margin-top: 3px; color: var(--muted); }
  .picker { display: grid; gap: 5px; padding: 4px 0 10px; }
  .pick { min-height: 40px; padding: 6px 12px; border-radius: 12px; background: var(--card); text-align: start;
    display: flex; justify-content: space-between; align-items: center; gap: 12px; font-size: 14px; font-weight: 500; }
  .pick[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .pick span { font-size: 12px; opacity: .7; }
  .sumline { margin-top: 6px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .empty { display: grid; place-content: center; justify-items: start; gap: 10px; min-height: 60vh; max-width: 520px; }
  .empty h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(34px, 4vw, 52px); line-height: 1.02;
    letter-spacing: -.02em; }
  .linkbox { padding: 10px 14px; border-radius: 14px; background: var(--well); font-size: 14px; overflow-wrap: anywhere;
    user-select: all; }

  /* A phone: one thing at a time — the clients, or the open client */
  @media (max-width: 899px) {
    #app { grid-template-columns: 1fr; height: auto; min-height: 100dvh; }
    .side { border: 0; padding-bottom: 28px; }
    .roster { overflow: visible; }
    .main { height: auto; overflow: visible; }
    body.open .side { display: none; }
    body:not(.open) .main { display: none; }
    .back { display: grid; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="app">
  <aside class="side">
    <div class="lockup" id="lockup" role="img" aria-label="Velmo Coaching"></div>
    <h2><span>Clients</span><span id="count"></span></h2>
    <ul class="roster" id="roster"></ul>
    <div class="foot">
      <button class="btn" id="add" type="button">New client</button>
      <button class="btn quiet" id="link" type="button">Intake link</button>
      <button class="btn quiet" id="mine" type="button">Copy my dashboard link</button>
      <p class="state" id="state" role="status"></p>
    </div>
  </aside>
  <main class="main" id="view"></main>
</div>
<script>
(function () {
  'use strict';
  /** The sheet's script. This page is a plain file on its own site; it holds no client data and no rule. */
  var API = 'https://script.google.com/macros/s/AKfycbxm3voEUyRaGcK0VkKzgsUQj-dTcpO_DFjN-UUxutY2-3jxr33s9eNnsFYL2DvyeHggkw/exec';
  // The coach key rides in the link's fragment (after #), which the browser never sends to any server.
  var KEY = '';
  try {
    var given = decodeURIComponent(location.hash.slice(1));
    if (/^[a-f0-9]{32,128}$/i.test(given)) KEY = given;
  } catch (e) {}
  window.addEventListener('hashchange', function () { location.reload(); });

  var MARK = '<svg viewBox="170 140 710 672" aria-hidden="true"><path d="M179.2 235.0 L394.2 802.7 L577.1 802.7 L362.1 235.0Z" opacity=".5"/><path d="M708.0 199.2 L429.8 802.7 L618.0 802.7 L863.2 270.8 L869.3 252.7 L871.1 233.5 L868.6 214.6 L862.0 196.6 L851.5 180.6 L837.8 167.3 L821.4 157.3 L803.3 151.3 L784.1 149.5 L765.2 152.0 L747.2 158.6 L731.2 169.1 L717.9 182.8Z"/></svg>';
  var $ = function (id) { return document.getElementById(id); };
  var view = $('view'), rosterBox = $('roster'), stateBox = $('state');
  var D = null;           // the open client's detail, as the server last gave it
  var BOOT = null;
  var busy = 0;
  var line = Promise.resolve();   // one request at a time, in the order they were made
  $('lockup').innerHTML = MARK + 'elmo Coaching';

  function el(tag, props, kids) {
    var node = document.createElement(tag);
    Object.keys(props || {}).forEach(function (key) {
      if (key === 'class') node.className = props[key];
      else if (key === 'text') node.textContent = props[key];
      else if (key === 'html') node.innerHTML = props[key];
      else if (key.slice(0, 2) === 'on') node.addEventListener(key.slice(2), props[key]);
      else if (props[key] !== undefined && props[key] !== null) node.setAttribute(key, props[key]);
    });
    (kids || []).forEach(function (kid) { if (kid) node.appendChild(typeof kid === 'string' ? document.createTextNode(kid) : kid); });
    return node;
  }
  function say(text, bad) { stateBox.textContent = text; stateBox.className = 'state' + (bad ? ' bad' : ''); }
  function send(name, args) {
    if (window.__MOCK__) return window.__MOCK__(name, args);
    return fetch(API, { method: 'POST', credentials: 'omit', referrerPolicy: 'no-referrer',
      body: JSON.stringify({ fn: name, key: KEY, args: args }) })
      .then(function (response) { return response.json(); }, function () { throw new Error('No connection.'); })
      .then(function (result) {
        if (!result || !result.ok) throw new Error((result && result.error) || 'The sheet did not answer.');
        return result.value;
      });
  }
  /** One call to the sheet's script. Shows Saving / Saved, and the reason when it fails. */
  function call(name, args, quiet) {
    busy += 1;
    if (!quiet) say('Saving…');
    var asked = line.then(function () { return send(name, args || []); });
    line = asked.then(function () {}, function () {});
    return asked.then(function (value) {
      busy -= 1;
      if (!quiet && busy === 0) say('Saved');
      return value;
    }, function (error) {
      busy -= 1;
      say(String((error && error.message) || error).replace(/^Error:\s*/, ''), true);
      throw error;
    });
  }
  function num(value, digits) {
    return Number(value).toLocaleString('en-GB', { minimumFractionDigits: digits || 0, maximumFractionDigits: digits || 0 });
  }
  function day(isoDate) {
    if (!isoDate) return '';
    var parts = String(isoDate).slice(0, 10).split('-');
    return new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]))
      .toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
  }
  function today() {
    var now = new Date();
    return now.getFullYear() + '-' + ('0' + (now.getMonth() + 1)).slice(-2) + '-' + ('0' + now.getDate()).slice(-2);
  }
  var GOALS = { lose: 'Losing fat', recomp: 'Same weight, leaner', gain: 'Gaining' };
  function label(client) { return client.name || 'New client · ' + day(client.created); }
  function card(title, size, kids, aside) {
    return el('section', { class: 'card ' + (size || '') }, [
      el('h2', {}, [el('span', { text: title }), aside ? el('span', { text: aside }) : null])].concat(kids || []));
  }

  // MARK: The clients, down the side

  function drawRoster() {
    var active = BOOT.roster.filter(function (c) { return c.status !== 'ended'; });
    $('count').textContent = String(active.length);
    rosterBox.textContent = '';
    active.forEach(function (c) {
      var sub = [GOALS[c.goal] || 'Goal not set', c.lastWeighIn ? 'weighed ' + day(c.lastWeighIn) : 'no weigh-in yet'];
      rosterBox.appendChild(el('li', {}, [el('button', { class: 'who', type: 'button',
        'aria-current': String(!!D && D.client.id === c.id), onclick: function () { openClient(c.id); } }, [
        el('b', { text: label(c) }),
        el('span', { class: 'kg', text: c.weightKg ? num(c.weightKg, 1) + ' kg' : '' }),
        el('span', { class: 'sub', text: sub.join(' · ') })
      ])]));
    });
    if (!active.length) rosterBox.appendChild(el('li', { class: 'state', text: 'No clients yet.' }));
  }
  /** The side list follows what was just changed on the open client, without asking the sheet again. */
  function syncRoster() {
    if (!D || !BOOT) return;
    var last = D.weights[D.weights.length - 1];
    BOOT.roster.forEach(function (c) {
      if (c.id !== D.client.id) return;
      c.name = D.client.name; c.goal = D.client.goal; c.status = D.client.status || 'active';
      c.weightKg = last ? last.kg : D.client.startWeightKg; c.lastWeighIn = last ? last.date : '';
    });
    drawRoster();
  }
  function showHome() {
    D = null;
    document.body.classList.remove('open');
    drawRoster();
    view.textContent = '';
    var linkBox = el('p', { class: 'linkbox', text: BOOT.intakeUrl || '' });
    view.appendChild(el('div', { class: 'empty' }, [
      el('h1', { text: BOOT.roster.length ? 'Pick a client.' : 'No clients yet.' }),
      el('p', { class: 'muted', text: 'Send the intake link; whoever answers it appears in the list on its own.' }),
      linkBox,
      BOOT.engine ? null : el('p', { class: 'note muted', text: 'The calorie rules are not installed yet, so no numbers are shown.' })
    ]));
  }

  // MARK: The open client

  /** Takes the server's answer. A food tapped while it was on its way is kept; its own save follows. */
  function take(detail) {
    var mine = dirty && D && D.client.id === detail.client.id ? D.mealPlan : null;
    D = detail;
    // The script version live before 13 Oct 2026 sends no worked-out grams and no limits: the page still opens.
    D.kinds = D.kinds || ['protein', 'carb', 'fat'];
    D.maxOptions = D.maxOptions || 3;
    D.old = D.meals === undefined;
    D.worked = JSON.stringify(detail.mealPlan);
    if (mine) D.mealPlan = mine;
  }
  function openClient(id) {
    flushMeals();
    say('');
    document.body.classList.add('open');
    view.textContent = '';
    view.appendChild(el('p', { class: 'muted', text: 'Opening…' }));
    call('coachClient', [id], true).then(function (detail) { dirty = false; take(detail); showClient(); });
  }
  function patch(key, value) {
    D.client[key] = value;
    var change = {};
    change[key] = value;
    flushMeals();
    return call('coachSave', [D.client.id, change]).then(function (detail) {
      take(detail);
      drawNumbers(); drawWeights(); drawMeals(); syncRoster();
    });
  }

  var numbersBox, weightsBox, mealsBox;

  function showClient() {
    view.textContent = '';
    var c = D.client;
    var pdfLink = el('a', { class: 'btn quiet', hidden: '', target: '_blank' });
    var pdf = el('button', { class: 'btn', type: 'button', text: 'Make PDF', onclick: function () {
      pdf.disabled = true;
      flushMeals();
      say('Making the PDF…');
      call('coachPdf', [D.client.id], true).then(function (file) {
        var bytes = atob(file.base64), buffer = new Uint8Array(bytes.length);
        for (var i = 0; i < bytes.length; i++) buffer[i] = bytes.charCodeAt(i);
        pdfLink.href = URL.createObjectURL(new Blob([buffer], { type: 'application/pdf' }));
        pdfLink.download = file.name;
        pdfLink.textContent = 'Save ' + file.name;
        pdfLink.hidden = false;
        pdf.disabled = false;
        say('PDF ready');
      }, function () { pdf.disabled = false; });
    } });
    view.appendChild(el('div', { class: 'head' }, [
      el('button', { class: 'back', type: 'button', 'aria-label': 'Back to clients', onclick: function () { flushMeals(); showHome(); },
        html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>' }),
      el('input', { class: 'name', type: 'text', value: c.name || '', placeholder: label(c), 'aria-label': 'Client name',
        maxlength: '80', autocomplete: 'off', onchange: function (e) { patch('name', e.target.value.trim()); } }),
      el('div', { class: 'tools' }, [pdfLink, pdf])
    ]));
    numbersBox = el('section', { class: 'card half' });
    weightsBox = el('section', { class: 'card half' });
    mealsBox = el('section', { class: 'card' });
    view.appendChild(el('div', { class: 'grid' }, [answersCard(), numbersBox, weightsBox, mealsBox, profileCard(), notesCard()]));
    drawNumbers(); drawWeights(); drawMeals(); drawRoster();
    view.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  // What the intake's codes mean, in plain words.
  var WORDS = {
    days: { mon: 'Mon', tue: 'Tue', wed: 'Wed', thu: 'Thu', fri: 'Fri', sat: 'Sat', sun: 'Sun' },
    times: { morning: 'Morning, 06–10', midday: 'Midday, 10–14', afternoon: 'Afternoon, 14–18', evening: 'Evening, 18–22' },
    foods: { chicken: 'Chicken, turkey', beef: 'Red meat', fish: 'Fish', egg: 'Eggs', yoghurt: 'Yoghurt', cheese: 'Cheese',
      legumes: 'Beans, lentils', veg: 'Vegetables', fruit: 'Fruit', rice: 'Rice', bulgur: 'Bulgur', pasta: 'Pasta',
      potato: 'Potatoes', bread: 'Bread', oats: 'Oats', nuts: 'Nuts' },
    health: { back: 'lower back', knee: 'knee', shoulder: 'shoulder', neck: 'neck', hip: 'hip', wrist: 'wrist',
      heart_bp: 'heart / blood pressure', other: 'other' },
    obstacle: { knowledge: 'Doesn’t know what to do', consistency: 'Starts, then stops', eating: 'Eating gets away from him',
      time: 'Never has the time', tried: 'Tried everything, nothing worked' }
  };
  function words(value, names) {
    return String(value || '').split(/[,;]/).map(function (item) { return item.trim(); }).filter(String)
      .map(function (item) { return names[item] || item; }).join(', ');
  }
  function answersCard() {
    var c = D.client;
    var health = String(c.health || '');
    var healthWords = !health ? '' : /^no\b/i.test(health) ? 'None' : 'Yes: ' + (words(health.replace(/^yes:?/i, ''), WORDS.health) || 'not said which');
    var cells = [
      ['What held him back', WORDS.obstacle[c.obstacle] || c.obstacle, true],
      ['Can train on', words(c.trainDays, WORDS.days)],
      ['Time of day', words(c.trainTime, WORDS.times)],
      ['Eats', words(c.foodsLiked, WORDS.foods)],
      ['Injury or health', healthWords],
      ['Meals a day now', c.meals ? String(c.meals) : '']
    ].filter(function (cell) { return cell[1]; });
    if (!cells.length) return null;
    return card('His answers', '', [el('div', { class: 'answers' }, cells.map(function (cell) {
      return el('div', { class: 'answer' + (cell[2] ? ' loud' : '') }, [el('span', { text: cell[0] }), el('b', { text: cell[1] })]);
    }))], c.created ? 'answered ' + day(c.created) : '');
  }

  function drawNumbers() {
    var n = D.numbers;
    numbersBox.textContent = '';
    numbersBox.appendChild(el('h2', {}, [el('span', { text: 'Daily numbers' }),
      n.ready ? el('span', { text: 'at ' + num(n.weightKg, 1) + ' kg' }) : null]));
    if (!n.ready) {
      numbersBox.appendChild(el('p', { class: 'need', text: 'Still needed: ' + n.missing.join(', ') + '.' }));
      numbersBox.appendChild(el('p', { class: 'note muted', text: 'Fill these in under Profile and the numbers appear.' }));
      return;
    }
    numbersBox.appendChild(el('div', { class: 'big' }, [num(n.foodKcal), el('span', { text: 'kcal a day' })]));
    numbersBox.appendChild(el('div', { class: 'trio' }, [
      el('div', {}, [el('b', { text: n.proteinG + ' g' }), el('span', { text: 'Protein' })]),
      el('div', {}, [el('b', { text: n.carbG + ' g' }), el('span', { text: 'Carbs' })]),
      el('div', {}, [el('b', { text: n.fatG + ' g' }), el('span', { text: 'Fat' })])
    ]));
    var rows = [['At rest', n.burn.resting], ['Steps', n.burn.steps], ['Training', n.burn.training]];
    if (n.burn.cardio) rows.push(['Cardio', n.burn.cardio]);
    rows.push(['Digesting food', n.burn.digestion], ['Burns in a day', n.burn.total],
      [n.changeKcal >= 0 ? 'Daily deficit' : 'Daily surplus', Math.abs(n.changeKcal)]);
    var list = el('ul', { class: 'rows' });
    rows.forEach(function (row) {
      list.appendChild(el('li', {}, [el('span', { text: row[0] }), el('b', { text: num(row[1]) + ' kcal' })]));
    });
    numbersBox.appendChild(list);
    if (n.heldAtFloor) {
      numbersBox.appendChild(el('p', { class: 'note', text: 'Food is held at his floor of ' + num(n.floorKcal)
        + ' kcal. The rest of the deficit, ' + num(n.cardioKcal) + ' kcal a day, is to come from cardio.' }));
    }
    if (n.refused === 'underAdultAge') numbersBox.appendChild(el('p', { class: 'note', text: 'Under 18: held at maintenance, no deficit.' }));
    if (n.refused === 'pregnantOrBreastfeeding') numbersBox.appendChild(el('p', { class: 'note', text: 'Pregnant or breastfeeding: held at maintenance.' }));
    numbersBox.appendChild(el('p', { class: 'note muted', text: n.engine }));
  }

  function spark(points) {
    if (points.length < 2) return null;
    var low = Math.min.apply(null, points), high = Math.max.apply(null, points), span = high - low || 1;
    var at = function (value, index) {
      return [(index / (points.length - 1) * 296 + 2).toFixed(1), (62 - (value - low) / span * 52).toFixed(1)];
    };
    var path = points.map(function (value, index) { return (index ? 'L' : 'M') + at(value, index).join(' '); }).join(' ');
    var end = at(points[points.length - 1], points.length - 1);
    return el('div', { html: '<svg class="spark" viewBox="0 0 300 68" preserveAspectRatio="none" aria-hidden="true"><path d="' + path
      + '" vector-effect="non-scaling-stroke"/><circle cx="' + end[0] + '" cy="' + end[1] + '" r="3.5"/></svg>' });
  }
  function drawWeights() {
    weightsBox.textContent = '';
    weightsBox.appendChild(el('h2', {}, [el('span', { text: 'Weight' })]));
    var date = el('input', { class: 'inp', type: 'date', value: today(), 'aria-label': 'Date' });
    var kg = el('input', { class: 'inp w', type: 'text', inputmode: 'decimal', placeholder: 'kg', 'aria-label': 'Weight in kg' });
    var add = function () {
      if (!kg.value.trim()) return kg.focus();
      flushMeals();
      call('coachWeight', [D.client.id, date.value, kg.value, '']).then(function (detail) {
        take(detail); drawNumbers(); drawWeights(); drawMeals(); syncRoster();
      });
    };
    kg.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
    var all = D.weights.slice().reverse();
    var start = Number(D.client.startWeightKg) || (D.weights[0] && D.weights[0].kg) || 0;
    if (all.length) {
      var change = all[0].kg - start;
      weightsBox.appendChild(el('div', { class: 'big' }, [num(all[0].kg, 1), el('span', { text: 'kg · ' + (change > 0 ? '+' : '')
        + num(change, 1) + ' since ' + num(start, 1) })]));
      var chart = spark((start ? [start] : []).concat(D.weights.map(function (w) { return w.kg; })));
      if (chart) weightsBox.appendChild(chart);
    } else {
      weightsBox.appendChild(el('p', { class: 'need', text: start ? 'Start weight ' + num(start, 1) + ' kg.' : 'No weight yet.' }));
      weightsBox.appendChild(el('p', { class: 'note muted', text: 'No weigh-ins yet.' }));
    }
    weightsBox.appendChild(el('div', { class: 'inline', style: 'margin-top:16px' }, [date, kg,
      el('button', { class: 'btn', type: 'button', text: 'Add', onclick: add })]));
    if (!all.length) return;
    var list = el('ul', { class: 'rows' });
    all.slice(0, 6).forEach(function (w) {
      list.appendChild(el('li', {}, [el('span', { text: day(w.date) }), el('b', { text: num(w.kg, 1) + ' kg' })]));
    });
    weightsBox.appendChild(list);
  }

  // MARK: Meal plan

  var KINDS = { protein: 'Protein', carb: 'Carbs', fat: 'Fat' };
  var openPicker = null;   // 'mealIndex:kind'
  var saveTimer = null;
  var dirty = false;       // a food was tapped and the sheet has not been told yet

  function saveMeals() {
    dirty = true;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flushMeals, 600);
  }
  /** Sends the tapped foods now. The sheet works the grams out and sends the plan back. */
  function flushMeals() {
    clearTimeout(saveTimer);
    if (!dirty || !D) return;
    dirty = false;
    call('coachMeals', [D.client.id, D.mealPlan]).then(function (detail) {
      if (!D || D.client.id !== detail.client.id) return;
      take(detail);
      drawMeals();
    }, function () { dirty = true; });
  }
  function drawMeals() {
    mealsBox.textContent = '';
    var s = D.mealSettings;
    var plan = (D.mealPlan && D.mealPlan.meals) || [];
    // The grams on screen are the sheet's own; after a tap they show again once the sheet has answered.
    var done = D.meals && JSON.stringify(D.mealPlan) === D.worked ? D.meals : null;
    mealsBox.appendChild(el('h2', {}, [el('span', { text: 'Meal plan' }), done ? el('span', { text: 'main choices: '
      + num(Math.round(done.total.kcal / 10) * 10) + ' kcal · ' + num(done.total.proteinG) + ' P · ' + num(done.total.carbG) + ' C · '
      + num(done.total.fatG) + ' F' }) : null]));
    var counts = el('div', { class: 'pills' });
    [2, 3, 4, 5, 6].forEach(function (n) {
      counts.appendChild(el('button', { class: 'pill', type: 'button', text: String(n), 'aria-pressed': String(s.meals === n),
        onclick: function () { patch('meals', n); } }));
    });
    var fields = el('div', { class: 'fields two' }, [el('div', { class: 'field' }, [el('span', { class: 'lab', text: 'Meals a day' }), counts])]);
    if (s.meals) {
      [['preMeal', 'Meal before training'], ['postMeal', 'Meal after training']].forEach(function (pair) {
        var pills = el('div', { class: 'pills' });
        for (var m = 1; m <= s.meals; m++) {
          (function (m) {
            pills.appendChild(el('button', { class: 'pill', type: 'button', text: String(m), 'aria-pressed': String(s[pair[0]] === m),
              onclick: function () { patch(pair[0], s[pair[0]] === m ? '' : m); } }));
          })(m);
        }
        fields.appendChild(el('div', { class: 'field' }, [el('span', { class: 'lab', text: pair[1] }), pills]));
      });
    }
    mealsBox.appendChild(fields);
    if (!s.meals) return mealsBox.appendChild(el('p', { class: 'note muted', text: 'Pick how many meals a day to start a plan.' }));
    if (!D.numbers.ready) return mealsBox.appendChild(el('p', { class: 'note muted', text: 'The plan needs the daily numbers first.' }));
    if (D.old) mealsBox.appendChild(el('p', { class: 'note muted', text: 'The grams appear once the sheet’s script is updated.' }));
    if (!s.preMeal || !s.postMeal) {
      mealsBox.appendChild(el('p', { class: 'note muted', text: 'Pick the meals before and after training: ' + num(s.carbShare)
        + '% of the day’s carbs go into those two. Until then carbs are spread evenly.' }));
    }
    var names = {};
    D.foods.forEach(function (food) { names[food.id] = food.en; });
    var board = el('div', { class: 'meals' });
    plan.forEach(function (chosen, index) {
      var meal = done && done.meals[index];
      var block = el('div', { class: 'meal' });
      var role = s.preMeal === index + 1 ? ' · before training' : s.postMeal === index + 1 ? ' · after training' : '';
      block.appendChild(el('h3', {}, ['Meal ' + (index + 1) + role,
        el('span', { text: meal ? 'about ' + num(Math.round(meal.total.kcal / 10) * 10) + ' kcal' : D.old ? '' : 'working out…' })]));
      D.kinds.forEach(function (kind) {
        var key = index + ':' + kind;
        var value = el('span', { class: 'v' });
        var ids = chosen[kind] || [];
        if (!ids.length) value.appendChild(el('i', { text: 'Choose' }));
        ids.forEach(function (id, at) {
          if (at) value.appendChild(el('i', { text: ' or ' }));
          var worked = meal && meal[kind].filter(function (option) { return option.id === id; })[0];
          if (worked) value.appendChild(el('b', { text: worked.grams + ' g ' }));
          value.appendChild(document.createTextNode(names[id] || id));
        });
        block.appendChild(el('button', { class: 'kind', type: 'button', 'aria-expanded': String(openPicker === key),
          onclick: function () { openPicker = openPicker === key ? null : key; drawMeals(); } }, [
          el('span', { class: 'k', text: KINDS[kind] }), value,
          el('span', { html: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>' })
        ]));
        if (openPicker === key) block.appendChild(picker(index, kind));
      });
      if (meal) {
        block.appendChild(el('p', { class: 'sumline', text: num(meal.total.proteinG) + ' g protein · ' + num(meal.total.carbG)
          + ' g carbs · ' + num(meal.total.fatG) + ' g fat' }));
      }
      board.appendChild(block);
    });
    mealsBox.appendChild(board);
    mealsBox.appendChild(el('p', { class: 'note muted', text: 'His target: ' + num(D.numbers.foodKcal) + ' kcal, ' + D.numbers.proteinG
      + ' g protein, ' + D.numbers.carbG + ' g carbs, ' + D.numbers.fatG + ' g fat. The first food on a line is the main choice, the others are swaps (up to '
      + D.maxOptions + '). A fatty main protein can push fat over; swap it if the day runs high.' }));
  }
  function picker(index, kind) {
    var chosen = D.mealPlan.meals[index][kind] || (D.mealPlan.meals[index][kind] = []);
    var box = el('div', { class: 'picker' });
    D.foods.filter(function (food) { return food.on && food.category === kind; }).forEach(function (food) {
      var at = chosen.indexOf(food.id);
      box.appendChild(el('button', { class: 'pick', type: 'button', 'aria-pressed': String(at !== -1), onclick: function () {
        if (at !== -1) chosen.splice(at, 1);
        else if (chosen.length < D.maxOptions) chosen.push(food.id);
        else return;
        drawMeals(); saveMeals();
      } }, [food.en, el('span', { text: at === -1 ? '' : at === 0 ? 'main' : 'swap ' + at })]));
    });
    return box;
  }

  // MARK: Profile and notes

  function profileCard() {
    var c = D.client, d = D.defaults;
    var fields = el('div', { class: 'fields two' });
    function pills(key, options) {
      var row = el('div', { class: 'pills' });
      var buttons = options.map(function (option) {
        var button = el('button', { class: 'pill', type: 'button', text: option[1], onclick: function () {
          var value = String(D.client[key]) === String(option[0]) ? '' : option[0];
          buttons.forEach(function (b) { b.setAttribute('aria-pressed', 'false'); });
          if (value !== '') button.setAttribute('aria-pressed', 'true');
          patch(key, value);
        } });
        button.setAttribute('aria-pressed', String(String(c[key]) === String(option[0]) && c[key] !== ''));
        row.appendChild(button);
        return button;
      });
      return row;
    }
    function number(key, placeholder) {
      return el('input', { class: 'inp w', type: 'text', inputmode: 'decimal', value: c[key] === undefined ? '' : c[key],
        placeholder: placeholder || '', 'aria-label': key, onchange: function (e) { patch(key, e.target.value.trim()); } });
    }
    function row(text, control, hint) {
      fields.appendChild(el('div', { class: 'field' }, [el('span', { class: 'lab', text: text }), control,
        hint ? el('span', { class: 'hint', text: hint }) : null]));
    }
    row('Sex', pills('sex', [['male', 'Male'], ['female', 'Female']]));
    row('Goal', pills('goal', [['lose', 'Lose'], ['recomp', 'Same weight'], ['gain', 'Gain']]));
    row('Age', number('age'));
    row('Height, cm', number('heightCm'));
    row('Start weight, kg', number('startWeightKg'), 'The latest weigh-in is used once there is one.');
    row('Pace, % of body weight a week', number('pacePct', String(d.default_pace_lose)),
      'Blank uses ' + d.default_pace_lose + '% when losing. Gaining needs a pace typed here.');
    row('Steps a day', number('steps'));
    row('Activity, if steps are not known', pills('activity', [['notVeryActive', 'Sitting'], ['lightlyActive', 'On feet'],
      ['active', 'Moving'], ['veryActive', 'Heavy work']]));
    row('Training days a week', number('trainingDays', String(d.default_training_days)));
    row('Session, minutes', number('sessionMin', String(d.default_session_minutes)));
    row('Protein, g per kg', pills('proteinLevel', [['1.6', '1.6'], ['2', '2.0'], ['2.2', '2.2']]), 'Blank lets the app choose from the goal.');
    row('Fat, g per kg', number('fatPerKg'), 'Blank uses the app’s default.');
    row('Carbs around training, %', number('carbShare', String(d.default_carb_share)));
    row('PDF language', pills('language', [['tr', 'Türkçe'], ['en', 'English']]));
    row('Pregnant or breastfeeding', pills('pregnant', [[true, 'Yes']]));
    row('History of disordered eating', pills('holdMaintenance', [[true, 'Hold at maintenance']]));
    row('Status', pills('status', [['active', 'Active'], ['paused', 'Paused'], ['ended', 'Ended']]));
    return card('Profile', 'wide', [fields]);
  }
  function notesCard() {
    return card('Notes', 'third', [el('textarea', { class: 'inp', 'aria-label': 'Notes',
      onchange: function (e) { patch('notes', e.target.value); } }, [D.client.notes || ''])]);
  }

  // MARK: Start

  $('add').addEventListener('click', function () {
    call('coachNewClient').then(function (id) {
      return call('coachBoot', [], true).then(function (boot) { BOOT = boot; openClient(id); });
    });
  });
  $('link').addEventListener('click', function () {
    var url = (BOOT && BOOT.intakeUrl) || '';
    var copied = function () { say('Intake link copied'); };
    try { navigator.clipboard.writeText(url).then(copied, function () { say(url); }); } catch (e) { say(url); }
  });
  $('mine').addEventListener('click', function () {
    try {
      navigator.clipboard.writeText(location.href).then(function () { say('Copied. Keep it to yourself.'); },
        function () { say('Copy it from the address bar.', true); });
    } catch (e) { say('Copy it from the address bar.', true); }
  });
  if (!KEY && !window.__MOCK__) {
    view.appendChild(el('div', { class: 'empty' }, [el('h1', { text: 'This page needs your coach link.' }),
      el('p', { class: 'muted', text: 'Open it from the sheet: Coaching, then Open my coach page.' })]));
    return;
  }
  view.appendChild(el('p', { class: 'muted', text: 'Opening…' }));
  call('coachBoot', [], true).then(function (boot) { BOOT = boot; showHome(); }, function () {
    view.textContent = '';
    view.appendChild(el('div', { class: 'empty' }, [el('h1', { text: 'Could not open your clients.' }),
      el('p', { class: 'muted', text: 'Check the link is your full coach link, then reload.' })]));
  });
})();
</script>
</body>
</html>
