  /* The coach's dashboard, in Velmo's own look: the warm ground, near-black ink, one dark button. Sections are
     flat (a heading over a hairline); only what can be tapped is drawn as a control. */
  :root {
    --bg: #E7E2D9; --glow: rgba(255, 255, 255, .72); --ink: rgba(16, 18, 24, .94); --muted: rgba(16, 18, 24, .62);
    --line: rgba(16, 18, 24, .12); --well: rgba(16, 18, 24, .065); --well-press: rgba(16, 18, 24, .12);
    --accent: #14161C; --on-accent: #FFFFFF; --error: #A3261E; --good: #1E8A47;
    --quint: cubic-bezier(.22, 1, .36, 1);
    --display: "Cal Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font: system-ui, -apple-system, "SF Pro Text", "Segoe UI", Roboto, sans-serif; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #090A0E; --glow: rgba(255, 255, 255, .08); --ink: rgba(255, 255, 255, .96);
      --muted: rgba(255, 255, 255, .64); --line: rgba(255, 255, 255, .14); --well: rgba(255, 255, 255, .09);
      --well-press: rgba(255, 255, 255, .16); --accent: #FFFFFF; --on-accent: #14161C; --error: #FF8A7A;
      --good: #3DDC84; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #090A0E; --glow: rgba(255, 255, 255, .08); --ink: rgba(255, 255, 255, .96);
    --muted: rgba(255, 255, 255, .64); --line: rgba(255, 255, 255, .14); --well: rgba(255, 255, 255, .09);
    --well-press: rgba(255, 255, 255, .16); --accent: #FFFFFF; --on-accent: #14161C; --error: #FF8A7A;
    --good: #3DDC84; color-scheme: dark; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45;
    -webkit-font-smoothing: antialiased; font-synthesis: none; }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(110% 60% at 30% -10%, var(--glow), transparent 66%); }
  ::selection { background: var(--accent); color: var(--on-accent); }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  p { margin: 0; }
  .muted { color: var(--muted); }
  [hidden] { display: none !important; }

  /* The bar: the name, the tabs, what can be done */
  .bar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 8px 22px; flex-wrap: wrap;
    padding: 14px clamp(16px, 3vw, 44px) 0; background: var(--bg); border-bottom: 1px solid var(--line); }
  .lockup { display: flex; align-items: baseline; font-family: var(--display); font-size: 22px; letter-spacing: -.01em;
    white-space: nowrap; padding-bottom: 12px; }
  .lockup svg { width: .78em; height: .74em; margin-inline-end: -.03em; fill: currentColor; flex: none; }
  .tabs { display: flex; gap: 22px; align-self: stretch; min-width: 0; flex: 1; }
  .tab { position: relative; padding: 4px 0 14px; font-weight: 600; color: var(--muted); white-space: nowrap;
    max-width: 46vw; overflow: hidden; text-overflow: ellipsis; transition: color .18s ease; }
  .tab:hover { color: var(--ink); }
  .tab[aria-current="page"] { color: var(--ink); }
  .tab[aria-current="page"]::after { content: ""; position: absolute; inset: auto 0 -1px; height: 2px; background: var(--accent); }
  .acts { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-bottom: 10px; }
  .state { min-width: 64px; font-size: 13px; color: var(--muted); text-align: end; }
  .state.bad { color: var(--error); }

  .btn { min-height: 38px; padding: 0 16px; border-radius: 19px; background: var(--accent); color: var(--on-accent);
    font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    white-space: nowrap; transition: transform .12s var(--quint), opacity .2s ease, background .16s ease; }
  .btn:active { transform: scale(.97); }
  .btn.quiet { background: var(--well); color: var(--ink); }
  .btn.quiet:hover { background: var(--well-press); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.small { min-height: 32px; padding: 0 13px; border-radius: 16px; font-size: 13px; }

  .main { padding: 26px clamp(16px, 3vw, 44px) 90px; max-width: 1180px; }
  h1 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(30px, 3.4vw, 42px); line-height: 1.05;
    letter-spacing: -.02em; }
  h2 { margin: 0 0 12px; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  h2 span + span { letter-spacing: 0; text-transform: none; font-weight: 500; font-size: 13px; }
  .sec { margin-top: 40px; }
  .cols { display: grid; gap: 0 56px; }
  @media (min-width: 900px) { .cols { grid-template-columns: 1fr 1fr; } }

  /* A pull-down: the system's own menu under a quiet pill */
  .pull { position: relative; display: inline-flex; max-width: 100%; }
  .pull select { appearance: none; -webkit-appearance: none; border: 0; outline: 0; margin: 0; min-height: 34px;
    padding: 0 28px 0 12px; border-radius: 10px; background: var(--well); font-weight: 600; font-size: 14px;
    cursor: pointer; max-width: 100%; text-overflow: ellipsis; field-sizing: content; transition: background .16s ease; }
  .pull select:hover { background: var(--well-press); }
  .pull select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pull::after { content: ""; position: absolute; inset-inline-end: 12px; top: 50%; width: 6px; height: 6px;
    border-inline-end: 1.8px solid var(--ink); border-bottom: 1.8px solid var(--ink); opacity: .55;
    transform: translateY(-72%) rotate(45deg); pointer-events: none; }
  .pull.rest select { color: var(--muted); }
  .inp { height: 34px; padding: 0 12px; border-radius: 10px; background: var(--well); border: 0; outline: none;
    font-weight: 600; font-size: 14px; font-variant-numeric: tabular-nums; min-width: 0; }
  .inp:focus { box-shadow: inset 0 0 0 2px var(--accent); }
  .inp.w { width: 96px; }
  .inp.grow { flex: 1; min-width: 160px; font-weight: 500; }
  textarea.inp { height: auto; min-height: 120px; padding: 10px 12px; width: 100%; resize: vertical; font-weight: 500; }
  .set { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
  .set label { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--muted); }

  /* Overview: one row per client. A row opens the client, so it is drawn as one. */
  .tbl { width: 100%; }
  .thead, .crow { display: grid; grid-template-columns: minmax(150px, 1.5fr) minmax(90px, .8fr) minmax(110px, 1fr) minmax(150px, 1.7fr) 86px 16px;
    gap: 0 18px; align-items: center; padding: 0 12px; }
  .thead { padding-bottom: 8px; font-size: 12px; font-weight: 600; letter-spacing: .09em; text-transform: uppercase;
    color: var(--muted); border-bottom: 1px solid var(--line); }
  .crow { width: 100%; text-align: start; min-height: 62px; border-bottom: 1px solid var(--line); border-radius: 0;
    transition: background .16s ease; }
  .crow:hover { background: var(--well); }
  .crow:active { background: var(--well-press); }
  .crow b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow small { display: block; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crow .num { font-variant-numeric: tabular-nums; }
  .crow .go { width: 8px; height: 8px; border-inline-end: 1.8px solid var(--muted); border-top: 1.8px solid var(--muted);
    transform: rotate(45deg); justify-self: end; }
  .crow.off { color: var(--muted); }
  .tick { color: var(--good); font-weight: 700; margin-inline-end: 4px; }

  /* The open client */
  .head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .name { flex: 1; min-width: 200px; background: none; border: 0; padding: 0; outline: none; font-family: var(--display);
    font-size: clamp(30px, 3.4vw, 42px); line-height: 1.1; letter-spacing: -.02em; caret-color: var(--accent); }
  .name::placeholder { color: var(--muted); opacity: .8; }

    var s = D.mealSettings, plan = D.mealPlan.meals;

            if (taken) return;

          });

    if (n.heldAtFloor) rows.push(['Held at floor', num(n.floorKcal) + ' kcal'], ['From cardio', num(n.cardioKcal) + ' kcal']);
    if (n.refused === 'underAdultAge') rows.push(['Under 18', 'Maintenance']);
    if (n.refused === 'pregnantOrBreastfeeding') rows.push(['Pregnant or breastfeeding', 'Maintenance']);
    var list = el('dl', { class: 'dl' });
    rows.forEach(function (row) { list.appendChild(el('dt', { text: row[0] })); list.appendChild(el('dd', { text: row[1] })); });
    numbersBox.appendChild(list);
    numbersBox.appendChild(el('p', { class: 'note muted', text: n.engine }));
  }

  function spark(points) {
    if (points.length < 2) return null;
    var low = Math.min.apply(null, points), high = Math.max.apply(null, points), span = high - low || 1;
    var at = function (value, index) {
      return [(index / (points.length - 1) * 296 + 2).toFixed(1), (58 - (value - low) / span * 52).toFixed(1)];
    };
    var path = points.map(function (value, index) { return (index ? 'L' : 'M') + at(value, index).join(' '); }).join(' ');
    var end = at(points[points.length - 1], points.length - 1);
    return el('div', { html: '<svg class="spark" viewBox="0 0 300 64" preserveAspectRatio="none" aria-hidden="true"><path d="' + path
      + '" vector-effect="non-scaling-stroke"/><circle cx="' + end[0] + '" cy="' + end[1] + '" r="3.5"/></svg>' });
  }
  function drawWeights() {
    weightsBox.textContent = '';
    var all = D.weights.slice().reverse();
    var start = Number(D.client.startWeightKg) || (D.weights[0] && D.weights[0].kg) || 0;
    var change = all.length ? all[0].kg - start : 0;
    weightsBox.appendChild(el('h2', {}, [el('span', { text: 'Weight' }),
      all.length && start ? el('span', { text: (change > 0 ? '+' : '') + num(change, 1) + ' from ' + num(start, 1) }) : null]));
    var now = all.length ? all[0].kg : start;
    if (now) weightsBox.appendChild(el('div', { class: 'big' }, [num(now, 1), el('span', { text: 'kg' })]));
    var chart = spark((start ? [start] : []).concat(D.weights.map(function (w) { return w.kg; })));
    if (chart) weightsBox.appendChild(chart);
    var date = el('input', { class: 'inp', type: 'date', value: today(), 'aria-label': 'Date' });
    var kg = el('input', { class: 'inp w', type: 'text', inputmode: 'decimal', placeholder: 'kg', 'aria-label': 'Weight in kg' });
    var add = function () {
      if (!kg.value.trim()) return kg.focus();
      flushMeals();
      call('coachWeight', [D.client.id, date.value, kg.value, '']).then(function (detail) { take(detail); redraw(); });
    };
    kg.addEventListener('keydown', function (e) { if (e.key === 'Enter') add(); });
    weightsBox.appendChild(el('div', { class: 'inline' }, [date, kg, el('button', { class: 'btn small', type: 'button', text: 'Add', onclick: add })]));
    if (!all.length) return;
    var list = el('dl', { class: 'dl', style: 'margin-top:14px' });
    all.slice(0, 6).forEach(function (w) {
      list.appendChild(el('dt', { text: day(w.date) }));
      list.appendChild(el('dd', { class: 'has' }, [num(w.kg, 1) + ' kg',
        el('button', { class: 'x', type: 'button', html: CROSS, 'aria-label': 'Delete weigh-in of ' + day(w.date), onclick: function () {
          if (!window.confirm('Delete ' + num(w.kg, 1) + ' kg, ' + day(w.date) + '?')) return;
          flushMeals();
          call('coachWeightDelete', [D.client.id, w.date, w.kg]).then(function (detail) { take(detail); redraw(); });
        } })]));
    });
    weightsBox.appendChild(list);
  }

  // MARK: Profile and notes

  function pillRow(key, options) {
    var row = el('div', { class: 'pills' });
    var buttons = options.map(function (option) {
      var button = el('button', { class: 'pill', type: 'button', text: option[1], onclick: function () {
        var value = String(D.client[key]) === String(option[0]) ? '' : option[0];
        document.querySelectorAll('[data-pill="' + key + '"]').forEach(function (b) {
          b.setAttribute('aria-pressed', String(value !== '' && b.getAttribute('data-value') === String(option[0])));
        });
        patch(key, value);
      } });
      button.setAttribute('data-pill', key);
      button.setAttribute('data-value', String(option[0]));
      button.setAttribute('aria-pressed', String(String(D.client[key]) === String(option[0]) && D.client[key] !== ''));
      row.appendChild(button);
      return button;
    });
    return row;
  }
  function profileSection() {
    var c = D.client, d = D.defaults;
    var fields = el('div', { class: 'fields' });
    function number(key, placeholder) {
      return el('input', { class: 'inp w', type: 'text', inputmode: 'decimal', value: c[key] === undefined ? '' : c[key],
        placeholder: placeholder === undefined ? '' : String(placeholder), 'aria-label': key, onchange: function (e) { patch(key, e.target.value.trim()); } });
    }
    function row(text, control) {
      fields.appendChild(el('div', { class: 'field' }, [el('span', { class: 'lab', text: text }), control]));
    }
    row('Sex', pillRow('sex', [['male', 'Male'], ['female', 'Female']]));
    row('Goal', pillRow('goal', [['lose', 'Lose'], ['recomp', 'Same weight'], ['gain', 'Gain']]));
    row('Age', number('age'));
    row('Height, cm', number('heightCm'));
    row('Start weight, kg', number('startWeightKg'));
    row('Pace, % a week', number('pacePct', d.default_pace_lose));
    row('Steps now', number('steps'));
    row('Activity, if no steps', pillRow('activity', [['notVeryActive', 'Sitting'], ['lightlyActive', 'On feet'],
      ['active', 'Moving'], ['veryActive', 'Heavy work']]));
    row('Training days a week', number('trainingDays', d.default_training_days));
    row('Session, minutes', number('sessionMin', d.default_session_minutes));
    row('Protein, g per kg', pillRow('proteinLevel', [['1.6', '1.6'], ['2', '2.0'], ['2.2', '2.2']]));
    row('Fat, g per kg', number('fatPerKg'));
    row('Carbs around training, %', number('carbShare', d.default_carb_share));
    row('Pregnant or breastfeeding', pillRow('pregnant', [[true, 'Yes']]));
    row('Disordered eating history', pillRow('holdMaintenance', [[true, 'Hold at maintenance']]));
    row('Status', pillRow('status', [['active', 'Active'], ['paused', 'Paused'], ['ended', 'Ended']]));
    return section('Profile', [fields]);
  }
  function notesSection() {
    return section('Notes', [el('textarea', { class: 'inp', 'aria-label': 'Notes',
      onchange: function (e) { patch('notes', e.target.value); } }, [String(D.client.notes || '')])]);
  }

  // MARK: Foods: what a plan is drafted from. Names and use only; the per-100 g values stay in the sheet.

  var KIND = { protein: 'Protein', carb: 'Carbs', fat: 'Fat', side: 'Fruit and vegetables' };
  var FOODS = null;
  function showFoods(openId) {
    D = null; onFoods = true;
    drawTabs();
    view.textContent = '';
    window.scrollTo(0, 0);
    if (BOOT.roster.length && BOOT.roster[0].week === undefined) return view.appendChild(el('p', { class: 'muted', text: 'Needs the script update.' }));
    var draw = function () {
      view.textContent = '';
      if (openId !== undefined) return view.appendChild(foodForm(FOODS.filter(function (food) { return food.id === openId; })[0] || null));
      view.appendChild(el('div', { class: 'head' }, [el('h1', { text: 'Foods', style: 'flex:1' }),
        el('button', { class: 'btn', type: 'button', text: 'Add food', onclick: function () { showFoods(''); } })]));
      Object.keys(KIND).forEach(function (kind) {
        var list = FOODS.filter(function (food) { return food.category === kind; });
        if (!list.length) return;
        view.appendChild(section(KIND[kind], list.map(function (food) {
          return el('button', { class: 'frow' + (food.on ? '' : ' off'), type: 'button', onclick: function () { showFoods(food.id); } }, [
            el('span', {}, [el('b', { text: food.en }), food.tr !== food.en ? el('small', { text: '  ' + food.tr }) : null]),
            el('small', { text: food.slots.length ? food.slots.map(function (slot) { return SLOT[slot]; }).join(', ') : 'Any meal' }),
            el('small', { text: food.on ? '' : 'Off' }), el('span', { class: 'go', 'aria-hidden': 'true' })]);
        })));
      });
    };
    if (FOODS && openId !== undefined) return draw();
    view.appendChild(el('p', { class: 'muted', text: 'Opening…' }));
    call('coachFoods', [], true).then(function (foods) { FOODS = foods; if (onFoods) draw(); }, function () {});
  }
  function foodForm(food) {
    var isNew = !food;
    food = food || { tr: '', en: '', category: 'protein', group: '', slots: [], on: true, unitTr: '', unitEn: '', unitG: '', unitStep: '', portionG: '' };
    var slots = food.slots.slice();
    var text = function (value, placeholder, name, cls) {
      return el('input', { class: 'inp' + (cls || ''), type: 'text', value: value === undefined || value === null ? '' : String(value),
        placeholder: placeholder || '', 'aria-label': name, autocomplete: 'off' });
    };
    var numeric = function (value, placeholder, name) { var input = text(value, placeholder, name, ' w'); input.setAttribute('inputmode', 'decimal'); return input; };
    var keep = isNew ? '' : 'same';
    var f = { tr: text(food.tr, '', 'Turkish name'), en: text(food.en, '', 'English name'),
      kcal: numeric('', keep, 'kcal per 100 g'), proteinG: numeric('', keep, 'Protein per 100 g'), carbG: numeric('', keep, 'Carbs per 100 g'),
      fatG: numeric('', keep, 'Fat per 100 g'), unitG: numeric(food.unitG, 'weighed', 'Grams in one'), unitTr: text(food.unitTr, 'ölçek', 'Counted as, Turkish', ' w'),
      unitEn: text(food.unitEn, 'scoop', 'Counted as, English', ' w'), portionG: numeric(food.portionG, '', 'Portion in grams') };
    var kind = food.category, group = food.group, on = food.on;
    var groups = [['', 'Always allowed']].concat(Object.keys(WORDS.foods).map(function (id) { return [id, WORDS.foods[id]]; }));
    if (group && !WORDS.foods[group]) groups.push([group, 'By hand only']);
    else groups.push(['byhand', 'By hand only']);
    var pills = el('div', { class: 'pills' }, Object.keys(SLOT).map(function (slot) {
      var pill = el('button', { class: 'pill', type: 'button', text: SLOT[slot], 'aria-pressed': String(slots.indexOf(slot) !== -1), onclick: function () {
        var at = slots.indexOf(slot);
        if (at === -1) slots.push(slot); else slots.splice(at, 1);
        pill.setAttribute('aria-pressed', String(at === -1));
      } });
      return pill;
    }));
    var row = function (name, control) { return el('div', { class: 'field' }, [el('span', { class: 'lab', text: name }), control]); };
    var save = function () {
      var out = { tr: f.tr.value.trim(), en: f.en.value.trim(), category: kind, group: group, slots: slots, on: on,
        unitG: f.unitG.value.trim(), unitTr: f.unitTr.value.trim(), unitEn: f.unitEn.value.trim(), unitStep: food.unitStep, portionG: f.portionG.value.trim() };
      ['kcal', 'proteinG', 'carbG', 'fatG'].forEach(function (name) { if (f[name].value.trim()) out[name] = f[name].value.trim().replace(',', '.'); });
      if (!isNew) out.id = food.id;
      call('coachFoodSave', [out]).then(function (foods) { FOODS = foods; if (BOOT) BOOT.details = {}; showFoods(); });
    };
    return el('div', { class: 'form' }, [
      el('h1', { text: isNew ? 'New food' : food.en, style: 'margin-bottom:18px' }),
      row('English', f.en), row('Turkish', f.tr),
      row('Kind', pull(Object.keys(KIND).map(function (id) { return [id, KIND[id]]; }), kind, function (value) { kind = value; }, 'Kind')),
      row('Eaten if ticked', pull(groups, group, function (value) { group = value; }, 'Intake answer')),
      row('Meals', pills),
      row('kcal per 100 g', f.kcal), row('Protein per 100 g', f.proteinG), row('Carbs per 100 g', f.carbG), row('Fat per 100 g', f.fatG),
      row('Grams in one', f.unitG), row('Word, Turkish', f.unitTr), row('Word, English', f.unitEn),
      row('Portion, g', f.portionG),
      row('In use', pull([['yes', 'On'], ['no', 'Off']], on ? 'yes' : 'no', function (value) { on = value === 'yes'; }, 'In use')),
      el('div', { class: 'btns' }, [
        el('button', { class: 'btn', type: 'button', text: 'Save', onclick: save }),
        el('button', { class: 'btn quiet', type: 'button', text: 'Cancel', onclick: function () { showFoods(); } }),
        el('span', { class: 'sp' }),
        isNew ? null : el('button', { class: 'btn quiet danger', type: 'button', text: 'Delete food', onclick: function () {
          if (!window.confirm('Delete ' + food.en + '?\n\nPlans that use it lose it. This cannot be undone from the dashboard.')) return;
          call('coachFoodDelete', [food.id, 'delete']).then(function (foods) { FOODS = foods; if (BOOT) BOOT.details = {}; showFoods(); });
        } })
      ])
    ]);
  }

  // MARK: The client's plan, one A4 page; the browser saves it as a PDF

  var PRINT = {
    tr: { locale: 'tr-TR', title: 'Beslenme planı', kcal: 'kcal', protein: 'Protein', carbs: 'Karbonhidrat', fat: 'Yağ', steps: 'adım',
      slots: { breakfast: 'Kahvaltı', lunch: 'Öğle yemeği', snack: 'Ara öğün', dinner: 'Akşam yemeği' },
      pre: 'antrenmandan önce', post: 'antrenmandan sonra', pick: 'Her öğünde seçeneklerden birini seç.', week: 'Haftan',
      sessions: { upper: 'Üst vücut', lower: 'Alt vücut', full: 'Tüm vücut', rest: 'Dinlenme' },
      days: { sat: 'Cumartesi', sun: 'Pazar', mon: 'Pazartesi', tue: 'Salı', wed: 'Çarşamba', thu: 'Perşembe', fri: 'Cuma' } },
    en: { locale: 'en-GB', title: 'Nutrition plan', kcal: 'kcal', protein: 'Protein', carbs: 'Carbs', fat: 'Fat', steps: 'steps',
      slots: { breakfast: 'Breakfast', lunch: 'Lunch', snack: 'Snack', dinner: 'Dinner' },
      pre: 'before training', post: 'after training', pick: 'Pick one option at each meal.', week: 'Your week',
      sessions: { upper: 'Upper body', lower: 'Lower body', full: 'Full body', rest: 'Rest' },
      days: { sat: 'Saturday', sun: 'Sunday', mon: 'Monday', tue: 'Tuesday', wed: 'Wednesday', thu: 'Thursday', fri: 'Friday' } }
  };
  var pageTitle = document.title;

  function paper(lang) {
    var w = PRINT[lang], n = D.numbers, c = D.client;
    var byId = {};
    D.foods.forEach(function (food) { byId[food.id] = food; });
    var sheet = el('div', { class: 'paper', lang: lang });
    sheet.appendChild(el('div', { class: 'top' }, [el('div', { class: 'lockup', html: MARK + 'elmo Coaching' }),
      el('span', { class: 'date', text: new Date().toLocaleDateString(w.locale, { day: 'numeric', month: 'long', year: 'numeric' }) })]));
    sheet.appendChild(el('p', { class: 'who', text: c.name || w.title }));
    if (c.name) sheet.appendChild(el('p', { class: 'what', text: w.title }));
    var figures = [[num(n.foodKcal, 0, w.locale), w.kcal], [n.proteinG + ' g', w.protein], [n.carbG + ' g', w.carbs], [n.fatG + ' g', w.fat]];
    if (D.stepTarget !== '' && D.stepTarget !== undefined) figures.push([num(D.stepTarget, 0, w.locale), w.steps]);
    sheet.appendChild(el('div', { class: 'nums' }, figures.map(function (figure) {
      return el('span', {}, [el('b', { text: figure[0] }), ' ' + figure[1]]);
    })));
    (D.meals || []).forEach(function (meal) {
      var block = el('div', { class: 'pm' }, [el('h3', {}, [w.slots[meal.slot],
        meal.role ? el('span', { text: meal.role === 'pre' ? w.pre : w.post }) : null])]);
      meal.options.forEach(function (option, index) {
        var text = el('span');
        option.items.forEach(function (item, at) {
          if (at) text.appendChild(el('u', { text: '+' }));
          text.appendChild(el('b', { text: amount(item, byId[item.id], lang) }));
          text.appendChild(document.createTextNode(' ' + (byId[item.id] ? byId[item.id][lang] || byId[item.id].en : '')));
        });
        if (option.items.length) block.appendChild(el('div', { class: 'po' }, [el('i', { text: String(index + 1) }), text]));
      });
      sheet.appendChild(block);
    });
    sheet.appendChild(el('p', { class: 'pick', text: w.pick }));
    sheet.appendChild(el('h4', { text: w.week }));
    sheet.appendChild(el('div', { class: 'pw' }, D.days.map(function (d, index) {
      return el('div', { class: D.week[index] === 'rest' ? 'r' : '' }, [el('span', { text: w.days[d] }), el('b', { text: w.sessions[D.week[index]] })]);
    })));
    var notes = String(D.texts['before_' + lang] || '').split('\n').map(function (text) { return text.trim(); }).filter(String);
    if (notes.length) {
      sheet.appendChild(el('h4', { text: D.texts['before_heading_' + lang] || '' }));
      sheet.appendChild(el('ul', {}, notes.map(function (text) { return el('li', { text: text }); })));
    }
    return sheet;
  }
  /** Everything stays on the one page: the type steps down a little until it does. */
  function fit(sheet) {
    var k = 1;
    sheet.style.setProperty('--k', '1');
    while (sheet.scrollHeight > sheet.clientHeight + 1 && k > 0.7) {
      k -= 0.02;
      sheet.style.setProperty('--k', k.toFixed(2));
    }
    // On a narrow screen the page is shown smaller; on paper it is always its own size.
    sheet.style.zoom = '';
    var room = document.documentElement.clientWidth - 24;
    if (sheet.offsetWidth > room) sheet.style.zoom = String(Math.max(0.3, room / sheet.offsetWidth));
  }
  function showPrint() {
    if (!D || D.old || !D.numbers.ready || !D.meals) return;
    var lang = D.client.language === 'en' ? 'en' : 'tr';
    var stage = el('div', { class: 'stage' });
    var draw = function () {
      stage.textContent = '';
      var sheet = paper(lang);
      stage.appendChild(sheet);
      fit(sheet);
      document.title = (D.client.name || 'Velmo Coaching') + ' · ' + PRINT[lang].title;
    };
    printBox.textContent = '';
    printBox.appendChild(el('div', { class: 'pbar' }, [
      el('button', { class: 'btn quiet small', type: 'button', text: 'Back', onclick: hidePrint }),
      el('span', { class: 'sp' }),
      pull([['tr', 'Türkçe'], ['en', 'English']], lang, function (value) { lang = value; draw(); patch('language', value); }, 'Language'),
      el('button', { class: 'btn small', type: 'button', text: 'Save as PDF', onclick: function () { window.print(); } })
    ]));
    printBox.appendChild(stage);
    document.body.classList.add('printing');
    window.scrollTo(0, 0);
    var ready = document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve();
    draw();
    ready.then(draw);
    showPrint.redraw = draw;
  }
  function hidePrint() {
    document.body.classList.remove('printing');
    printBox.textContent = '';
    document.title = pageTitle;
    showPrint.redraw = null;
  }
  window.addEventListener('resize', function () { if (showPrint.redraw) showPrint.redraw(); });

  // MARK: Start

  function copy(text, done) {
    try { navigator.clipboard.writeText(text).then(function () { say(done); }, function () { say('Could not copy', true); }); }
    catch (e) { say('Could not copy', true); }
  }
  function copyIntake() { copy((BOOT && BOOT.intakeUrl) || '', 'Copied'); }
  $('add').addEventListener('click', function () {
    call('coachNewClient').then(function (id) {
      return call('coachBoot', [true], true).then(function (boot) { BOOT = boot; BOOT.at = Date.now(); openClient(id); });
    });
  });
  $('link').addEventListener('click', copyIntake);
  $('mine').addEventListener('click', function () { copy(location.href, 'Copied. Keep it private.'); });
  if (!KEY && !window.__MOCK__) {
    view.appendChild(el('div', { class: 'empty' }, [el('h1', { text: 'Open your coach link.' })]));
    return;
  }
  view.appendChild(el('p', { class: 'muted', text: 'Opening…' }));
  call('coachBoot', [true], true).then(function (boot) { BOOT = boot; BOOT.at = Date.now(); showOverview(); }, function () {
    view.textContent = '';
    view.appendChild(el('div', { class: 'empty' }, [el('h1', { text: 'Could not open.' }),
      el('button', { class: 'btn', type: 'button', text: 'Try again', onclick: function () { location.reload(); } })]));
  });
})();
</script>
</body>
