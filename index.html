  /* Velmo's own look: the warm ground, near-black ink, white glass rows and the one near-black button. */
  :root {
    --bg: #E7E2D9;
    --glow: rgba(255, 255, 255, .72);
    --ink: rgba(16, 18, 24, .94);
    --muted: rgba(16, 18, 24, .66);
    --line: rgba(16, 18, 24, .12);
    --row: rgba(255, 255, 255, .6);
    --row-edge: rgba(255, 255, 255, .92);
    --row-press: rgba(255, 255, 255, .86);
    --row-shadow: 0 1px 2px rgba(16, 18, 24, .05), 0 8px 24px -16px rgba(16, 18, 24, .18);
    --track: rgba(16, 18, 24, .1);
    --tick: rgba(16, 18, 24, .3);
    --accent: #14161C;
    --on-accent: #FFFFFF;
    --accent-off: rgba(20, 22, 28, .28);
    --error: #A3261E;
    --rec: #1E8A47;
    --seg: rgba(118, 118, 128, .16);
    --menu: rgba(250, 249, 247, .82);
    --quint: cubic-bezier(.22, 1, .36, 1);
    --std: cubic-bezier(.4, 0, .2, 1);
    --pop: cubic-bezier(.34, 1.4, .64, 1);
    --font: "Cal Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #090A0E; --glow: rgba(255, 255, 255, .09); --ink: rgba(255, 255, 255, .96);
      --muted: rgba(255, 255, 255, .68); --line: rgba(255, 255, 255, .14); --row: rgba(255, 255, 255, .075);
      --row-edge: rgba(255, 255, 255, .16); --row-press: rgba(255, 255, 255, .14); --row-shadow: none;
      --track: rgba(255, 255, 255, .12); --tick: rgba(255, 255, 255, .34); --accent: #FFFFFF;
      --on-accent: #14161C; --accent-off: rgba(255, 255, 255, .28); --error: #FF8A7A; --rec: #3DDC84; --seg: rgba(118, 118, 128, .28); --menu: rgba(44, 44, 48, .82); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #090A0E; --glow: rgba(255, 255, 255, .09); --ink: rgba(255, 255, 255, .96);
    --muted: rgba(255, 255, 255, .68); --line: rgba(255, 255, 255, .14); --row: rgba(255, 255, 255, .075);
    --row-edge: rgba(255, 255, 255, .16); --row-press: rgba(255, 255, 255, .14); --row-shadow: none;
    --track: rgba(255, 255, 255, .12); --tick: rgba(255, 255, 255, .34); --accent: #FFFFFF;
    --on-accent: #14161C; --accent-off: rgba(255, 255, 255, .28); --error: #FF8A7A; --rec: #3DDC84; --seg: rgba(118, 118, 128, .28); --menu: rgba(44, 44, 48, .82); color-scheme: dark;
  }

  :root[lang="ar"] { --font: "Cairo", "Cal Sans", system-ui, -apple-system, "Segoe UI", sans-serif; --dir: -1; }
  :root[lang="ar"] body { letter-spacing: 0; font-weight: 600; line-height: 1.5; }
  :root[lang="ar"] h1 { font-weight: 800; line-height: 1.25; letter-spacing: 0; }
  :root[lang="ar"] .cta, :root[lang="ar"] .item { font-weight: 700; }
  .wordmark, .lockup, .num output, .ticks, .lang-btn { font-family: "Cal Sans", system-ui, sans-serif; font-weight: 400; direction: ltr; }
  [dir="rtl"] #back svg, [dir="rtl"] .row svg { transform: scaleX(-1); }
  [dir="rtl"] .progress i { transform-origin: right; }
  [dir="rtl"] .wordmark .l { justify-content: flex-end; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.4;
    font-weight: 400; font-synthesis: none; letter-spacing: .005em; -webkit-font-smoothing: antialiased;
    overflow: hidden; overscroll-behavior: none;
  }
  /* The ground's light: one soft neutral glow from the top, the glass rows sit on it. */
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 62% at 50% -12%, var(--glow), transparent 68%); }
  ::selection { background: var(--accent); color: var(--on-accent); }
  button, input { font: inherit; color: inherit; letter-spacing: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  h1:focus { outline: none; }

  #app { position: relative; height: 100vh; height: 100dvh; max-width: 520px; margin: 0 auto; display: flex;
    flex-direction: column; }

  /* Top bar: back, the name, language; the progress line runs under them. */
  .bar { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; column-gap: 2px;
    padding: max(6px, env(safe-area-inset-top)) 12px 0; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; flex: none;
    transition: opacity .24s ease, transform .12s var(--quint), background .2s ease, width .36s var(--quint); }
  .icon-btn:active { background: var(--track); transform: scale(.94); transition-duration: .06s; }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn[hidden] { display: grid; opacity: 0; pointer-events: none; width: 12px; }
  .lockup { display: flex; align-items: baseline; gap: 0; font-size: 19px; white-space: nowrap; min-width: 0;
    overflow: hidden; transition: opacity .36s ease; }
  .lockup svg { width: .78em; height: .74em; margin-inline-end: -.03em; fill: currentColor; flex: none; }
  .lockup[hidden] { display: flex; opacity: 0; }
  .progress { grid-column: 1 / -1; height: 4px; margin: 8px 12px 0; background: var(--track); border-radius: 2px;
    overflow: hidden; transition: opacity .3s ease; }
  .progress i { display: block; height: 100%; width: 100%; background: var(--accent); border-radius: 2px;
    transform-origin: left; transform: scaleX(0); transition: transform .6s var(--quint); }
  .progress[hidden] { display: block; opacity: 0; }
  /* Language: an iOS pull-down menu. The button names the language; the menu grows out of it on frosted glass. */
  .bar { position: relative; z-index: 3; }
  .lang { position: relative; flex: none; transition: opacity .2s ease; }
  .lang[hidden] { display: block; opacity: 0; pointer-events: none; }
  .lang-btn { height: 34px; padding: 0 9px 0 10px; display: flex; align-items: center; gap: 5px; border-radius: 17px;
    background: var(--seg); font-size: 14px; letter-spacing: .03em; direction: ltr;
    transition: transform .14s var(--quint), background .2s ease; }
  .lang-btn svg { width: 15px; height: 15px; opacity: .72; }
  .lang-btn svg.ud { width: 9px; height: 14px; opacity: .5; }
  .lang-btn:active, .lang-btn[aria-expanded="true"] { transform: scale(.95); }
  .veil { position: fixed; inset: 0; z-index: 4; }
  .veil[hidden] { display: none; }
  .menu { position: absolute; z-index: 5; top: calc(100% + 8px); inset-inline-end: 0; width: 214px; padding: 0;
    border-radius: 14px; overflow: hidden; background: var(--menu); -webkit-backdrop-filter: blur(30px) saturate(180%);
    backdrop-filter: blur(30px) saturate(180%); box-shadow: 0 0 0 .5px rgba(0, 0, 0, .1), 0 18px 60px rgba(0, 0, 0, .24);
    transform-origin: 100% 0; transform: scale(.3); opacity: 0; visibility: hidden; pointer-events: none;
    transition: transform .2s var(--std), opacity .16s ease, visibility 0s .2s; }
  [dir="rtl"] .menu { transform-origin: 0 0; }
  .menu.open { transform: none; opacity: 1; visibility: visible; pointer-events: auto;
    transition: transform .42s cubic-bezier(.24, 1.24, .36, 1), opacity .18s ease, visibility 0s; }
  .menu button { width: 100%; height: 46px; padding: 0 16px; display: flex; align-items: center; justify-content: space-between;
    font-family: -apple-system, system-ui, "Segoe UI", Roboto, sans-serif; font-size: 17px; letter-spacing: 0;
    text-align: start; transition: background .12s ease; }
  .menu button + button { box-shadow: inset 0 .5px 0 var(--line); }
  .menu button:active { background: var(--track); }
  .menu button svg { width: 17px; height: 17px; opacity: 0; }
  .menu button[aria-checked="true"] svg { opacity: 1; }

  /* Stage: one screen at a time. The question and its control sit together, a little below the middle,
     where the thumb is; a screen taller than the stage scrolls from its top instead. */
  #stage { flex: 1; min-height: 0; position: relative; }
  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
    padding: 12px 24px 12px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .screen::before { content: ""; flex: 1.25 0 0px; }
  .screen::after { content: ""; flex: 1 0 0px; }

  /* Arriving: the heading first, then the line under it, then each answer in turn. Leaving: one quick step aside. */
  .screen.fwd .land { animation: land-fwd .46s var(--quint) backwards; animation-delay: var(--d, 0ms); }
  .screen.back .land { animation: land-back .46s var(--quint) backwards; animation-delay: var(--d, 0ms); }
  .screen.first .land { animation: land-up .6s var(--quint) backwards; animation-delay: var(--d, 0ms); }
  .screen.swap { animation: swap-in .42s .1s var(--quint) backwards; }
  .screen.leave { pointer-events: none; }
  .screen.leave-fwd { animation: leave-fwd .2s var(--std) both; }
  .screen.leave-back { animation: leave-back .2s var(--std) both; }
  .screen.leave-swap { animation: swap-out .16s ease both; }
  @keyframes land-fwd { from { opacity: 0; transform: translate3d(calc(22px * var(--dir, 1)), 0, 0); } }
  @keyframes land-back { from { opacity: 0; transform: translate3d(calc(-22px * var(--dir, 1)), 0, 0); } }
  @keyframes land-up { from { opacity: 0; transform: translate3d(0, 14px, 0); } }
  @keyframes leave-fwd { to { opacity: 0; transform: translate3d(calc(-18px * var(--dir, 1)), 0, 0); } }
  @keyframes leave-back { to { opacity: 0; transform: translate3d(calc(18px * var(--dir, 1)), 0, 0); } }
  @keyframes fade-in { from { opacity: 0; } }
  @keyframes swap-in { from { opacity: 0; filter: blur(8px); transform: scale(.985); } }
  @keyframes swap-out { to { opacity: 0; filter: blur(8px); } }
  .cta .lbl.new, .ghost.new { animation: fade-in .32s ease backwards; }
  @keyframes fade-out { to { opacity: 0; } }

  h1 { margin: 0; font-size: 32px; line-height: 1.12; font-weight: 400; letter-spacing: -.005em; text-wrap: balance; }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: 17px; line-height: 1.35; text-wrap: pretty; }
  .control { padding-top: 24px; }

  /* Welcome: the name leads, drawn in letter by letter beside the mark; the method in two sentences under it. */
  .intro::before { flex: 1 0 0px; }
  .intro::after { flex: 0 0 4px; }
  .wordmark { margin: 0; font-size: clamp(50px, 17.5vw, 80px); line-height: .98; letter-spacing: -.025em; font-weight: 400; }
  .wordmark .l { display: flex; align-items: baseline; white-space: nowrap; }
  .wordmark .l + .l { color: var(--muted); }
  /* The mark is the V of Velmo: cap-high, on the baseline, the letters closing up to it. */
  .wordmark .vm { width: .78em; height: .74em; margin: 0 -.035em 0 -.01em; flex: none; }
  .wordmark .vm svg { display: block; width: 100%; height: 100%; fill: var(--ink); overflow: visible; }
  .wordmark .vm path { transform-box: fill-box; transform-origin: 50% 100%; }
  .wordmark .ch { display: inline-block; }
  .intro.first .wordmark .ch { animation: letter .8s var(--quint) backwards; animation-delay: calc(var(--i) * 46ms + 360ms); }
  .intro.first .wordmark .vm path { animation: blade .9s var(--quint) backwards; }
  .intro.first .wordmark .vm path + path { animation-delay: .14s; }
  /* The mark keeps lifting, quietly: the blades part and lock back, the way the app's own opening does. */
  .wordmark .vm .front { animation: rep 5.2s 2.4s var(--std) infinite; }
  .wordmark .vm .rear { animation: rep-rear 5.2s 2.4s var(--std) infinite; }
  .intro.first .wordmark .vm .front { animation: blade .9s .14s var(--quint) backwards, rep 5.2s 2.4s var(--std) infinite; }
  .intro.first .wordmark .vm .rear { animation: blade .9s var(--quint) backwards, rep-rear 5.2s 2.4s var(--std) infinite; }
  @keyframes letter { from { opacity: 0; transform: translate3d(0, .42em, 0) scale(.96); filter: blur(8px); } }
  @keyframes blade { from { opacity: 0; transform: translateY(26%) scaleY(.6); } }
  @keyframes rep { 0%, 82%, 100% { transform: none; } 88% { transform: translate(5%, 7%); } 93% { transform: translate(-1.5%, -2%); } }
  @keyframes rep-rear { 0%, 82%, 100% { transform: none; } 88% { transform: translate(-4%, 6%); } 93% { transform: translate(1%, -1.5%); } }
  .eyebrow { margin: 30px 0 0; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
    display: flex; align-items: center; gap: 10px; }
  .eyebrow::before { content: ""; width: 22px; height: 2px; border-radius: 1px; background: currentColor; }
  .intro .promise { margin: 24px 0 0; font-size: 24px; line-height: 1.2; letter-spacing: -.005em; text-wrap: balance; }
  .intro .hint { font-size: 18px; line-height: 1.3; margin: 8px 0 14px; text-wrap: balance; }

  /* Choices: full-width glass rows; the picked one turns solid, with a check at the trailing edge. */
  .list { display: grid; gap: 10px; }
  .item { width: 100%; min-height: 60px; padding: 12px 20px; border-radius: 20px; background: var(--row);
    box-shadow: inset 0 0 0 1px var(--row-edge), var(--row-shadow);
    display: flex; align-items: center; justify-content: space-between; gap: 14px; text-align: start;
    font-size: 18px; line-height: 1.2;
    transition: background .22s ease, color .22s ease, box-shadow .22s ease, transform .12s var(--quint); }
  .item:active { transform: scale(.97); background: var(--row-press); transition-duration: .22s, .22s, .22s, .06s; }
  .item .lbl { display: block; }
  .item small { display: block; font-size: 14px; opacity: .7; margin-top: 2px; }
  .item .mark { flex: none; width: 22px; height: 22px; opacity: 0; transform: scale(.4);
    transition: opacity .14s ease, transform .34s var(--pop); }
  .item .mark svg { width: 22px; height: 22px; display: block; }
  .item[aria-checked="true"], .item[aria-pressed="true"] { background: var(--accent); color: var(--on-accent);
    box-shadow: inset 0 0 0 1px transparent, 0 10px 24px -14px rgba(16, 18, 24, .5); }
  .item[aria-checked="true"] .mark, .item[aria-pressed="true"] .mark { opacity: 1; transform: none; }
  .list.dense { gap: 8px; }
  .list.dense .item { min-height: 52px; padding: 10px 18px; font-size: 17px; border-radius: 18px; }

  /* Days: seven circles in a row; a week strip carries the date under the weekday */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin: 0 -4px; }
  .day { aspect-ratio: 1; min-height: 44px; border-radius: 50%; background: var(--row);
    box-shadow: inset 0 0 0 1px var(--row-edge), var(--row-shadow); display: grid; place-items: center;
    font-size: 14px; line-height: 1;
    transition: background .22s ease, color .22s ease, box-shadow .22s ease, transform .3s var(--pop); }
  .day:active { transform: scale(.9); background: var(--row-press); transition-duration: .22s, .22s, .22s, .06s; }
  .day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); box-shadow: inset 0 0 0 1px transparent; }
  .days.strip .day { aspect-ratio: auto; border-radius: 18px; min-height: 70px; padding: 10px 0; align-content: center;
    gap: 6px; }
  .days.strip .day b { font-size: 20px; font-weight: 400; font-variant-numeric: tabular-nums; }
  .days.strip .day span { font-size: 12px; opacity: .7; }
  .count { margin: 16px 0 0; text-align: center; font-size: 15px; color: var(--muted);
    transition: color .2s ease; }
  .count.met { color: var(--ink); }
  /* The days the coach recommends: ringed in the app's own "sweet spot" green until picked. */
  .day.rec { box-shadow: inset 0 0 0 2px var(--rec), var(--row-shadow); color: var(--rec); }
  .day.rec[aria-pressed="true"] { color: var(--on-accent); box-shadow: inset 0 0 0 1px transparent, 0 0 0 2px var(--bg), 0 0 0 4px var(--rec); }
  .rec-note { margin: 18px 0 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px;
    color: var(--rec); white-space: nowrap; }
  .rec-note::before { content: ""; width: 12px; height: 12px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--rec); flex: none; }
  .rec-note + .count { margin-top: 8px; }
  .list.cols { grid-template-columns: 1fr 1fr; gap: 8px; }
  .list.cols .item { min-height: 54px; padding: 10px 14px 10px 16px; font-size: 17px; gap: 8px; border-radius: 18px; }
  .list.cols .item .mark, .list.cols .item .mark svg { width: 18px; height: 18px; }

  /* Several short questions on one screen */
  .stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }
  .part .list .item { min-height: 50px; padding: 8px 16px; }
  .part .control { padding-top: 0; }
  .part > .sub { margin: 0 0 10px; font-size: 15px; color: var(--muted); }
  .part .num output { font-size: 46px; }
  .part .num output.l4 { font-size: 42px; }
  .part .num output.l5 { font-size: 36px; }
  .part .unit { display: none; }
  .part .ruler { margin-top: 8px; height: 64px; }
  .part .ruler::after { top: -2px; height: 40px; }
  .part .ticks span { top: 42px; }
  /* What a "yes" opens: it grows into place instead of jumping. */
  .more { display: grid; grid-template-rows: 0fr; opacity: 0; transition: grid-template-rows .42s var(--quint), opacity .3s ease; }
  .more > div { min-height: 0; overflow: hidden; }
  .more.open { grid-template-rows: 1fr; opacity: 1; }
  .more.open > div { overflow: visible; }
  .more .sub { margin: 0; padding: 22px 0 10px; font-size: 15px; color: var(--muted); }

  /* The one typed field left: a name, when that question is switched on */
  .field { width: 100%; background: none; border: 0; border-bottom: 2px solid var(--line); border-radius: 0;
    padding: 10px 0 12px; font-size: 28px; caret-color: var(--accent); outline: none; transition: border-color .2s ease; }
  .field:focus { border-bottom-color: var(--accent); }
  .field::placeholder { color: var(--muted); opacity: .75; }

  /* Number: the big numeral over a ruler */
  .num { display: flex; align-items: center; justify-content: center; }
  .num output { flex: 1; text-align: center; letter-spacing: -.02em; line-height: 1; font-size: 88px; }
  .num output.l4 { font-size: 76px; }
  .num output.l5 { font-size: 62px; }
  .unit { text-align: center; color: var(--muted); font-size: 17px; margin-top: 6px; }
  .ruler { position: relative; margin: 26px -24px 0; height: 88px; direction: ltr; }
  .ruler::after { content: ""; position: absolute; left: 50%; top: -6px; width: 3px; height: 56px; margin-left: -1.5px;
    background: var(--accent); border-radius: 2px; pointer-events: none; }
  .scroller { height: 100%; overflow-x: scroll; overflow-y: hidden; display: flex; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; cursor: grab;

  .scroller::-webkit-scrollbar { display: none; }

  .ticks { flex: none; position: relative; height: 100%;

    background-repeat: repeat-x; background-position: -1px 0, -.5px 0; }
  .ticks span { position: absolute; top: 50px; transform: translateX(-50%); font-size: 14px;
    color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Review */
  .rows { margin: 22px 0 0; padding: 0; list-style: none; }
  .rows li + li { border-top: 1px solid var(--line); }
  .row { width: 100%; text-align: start; padding: 14px 0; display: grid; grid-template-columns: 1fr 20px; gap: 2px 12px;
    align-items: center; }
  .row .q { grid-column: 1; font-size: 14px; color: var(--muted); line-height: 1.3; }
  .row .a { grid-column: 1; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; }
  .row svg { grid-column: 2; grid-row: 1 / span 2; width: 18px; height: 18px; color: var(--muted); }
  .row:active { opacity: .6; }

  /* Sent: a tick, two words, three short lines. */
  .sent .tick { width: 56px; height: 56px; }
  .sent .tick path { stroke: var(--accent); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .7s .2s var(--quint) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .sent h1 { margin-top: 18px; font-size: 44px; line-height: 1.02; letter-spacing: -.015em; }
  .sent .hint { font-size: 19px; margin-top: 8px; }
  .sent h2 { margin: 34px 0 10px; font-size: 13px; font-weight: 400; letter-spacing: .14em; text-transform: uppercase;
    color: var(--muted); }
  .sent ol { margin: 0; padding: 0; list-style: none; }
  .sent ol li { position: relative; padding: 13px 0; padding-inline-start: 20px; font-size: 17px; line-height: 1.35;
    text-wrap: pretty; }
  .sent ol li::before { content: ""; position: absolute; inset-inline-start: 2px; top: 22px; width: 6px; height: 6px;
    border-radius: 50%; background: var(--muted); }
  .sent ol li + li { border-top: 1px solid var(--line); }

  /* Dock: the one main action, in thumb reach */
  .dock { padding: 10px 18px max(14px, env(safe-area-inset-bottom)); display: grid; gap: 4px;
    transition: opacity .3s ease; }
  .dock[hidden] { display: none; }
  .cta { height: 58px; border-radius: 29px; background: var(--accent); color: var(--on-accent); font-size: 18px;
    letter-spacing: .01em; display: flex; align-items: center; justify-content: center; gap: 10px;
    box-shadow: 0 14px 28px -16px rgba(16, 18, 24, .55);
    transition: transform .12s var(--quint), background .28s ease, color .28s ease, box-shadow .28s ease; }

  .cta:disabled { background: var(--accent-off); box-shadow: none; cursor: default; }
  .cta .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor;
    border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ghost { height: 46px; font-size: 16px; color: var(--muted); border-radius: 23px; transition: transform .12s var(--quint); }
  .ghost:active { background: var(--track); transform: scale(.97); }
  .ghost[hidden] { display: none; }
  .error { margin: 0 6px 8px; color: var(--error); font-size: 15px; text-wrap: pretty; }
  .error[hidden] { display: none; }

  @media (max-height: 640px) {
    h1 { font-size: 27px; } .wordmark { font-size: 50px; } .eyebrow { margin-top: 20px; } .num output { font-size: 68px; }

  }

  }
</style>

  function daysControl(q, days, values, onPick, min) {
    var strip = !!days[0].date;
    var row = el('div', { class: 'days' + (strip ? ' strip' : ''), role: 'group', 'aria-label': title(q) });
    var count = el('p', { class: 'count', 'aria-live': 'polite' });
    var nodes = [];
    function sync() {
      var now = values();
      nodes.forEach(function (n) { n.node.setAttribute('aria-pressed', String(now.indexOf(n.v) !== -1)); });
      count.textContent = min > 1 ? now.length + '/' + min : '';
      count.className = 'count' + (now.length >= min ? ' met' : '');
    }
    var anyRec = false;
    days.forEach(function (day) {
      if (day.rec) anyRec = true;
      var node = el('button', { class: 'day' + (day.rec ? ' rec' : ''), type: 'button',
        'aria-label': day.full + (day.rec ? ' · ' + t('rec') : ''),
        onclick: function () { onPick(day.v); tick(); sync(); refreshDock(); } },
        strip ? [el('span', { text: day.short }), el('b', { text: day.date })] : [document.createTextNode(day.short)]);
      nodes.push({ v: day.v, node: node });
      row.appendChild(node);
    });
    sync();
    return el('div', {}, [row, anyRec ? el('p', { class: 'rec-note', text: t('rec') }) : null, min > 1 ? count : null]);
  }
  function toggle(list, value) {
    var at = list.indexOf(value);
    if (at === -1) list.push(value); else list.splice(at, 1);
  }
  function numberControl(q, a) {
    var min = Number(q.cfg.min) || 0, max = Number(q.cfg.max) || 100, step = Number(q.cfg.step) || 1, GAP = 14;
    var count = Math.round((max - min) / step);
    var major = count > 150 ? 20 : count > 70 ? 10 : 5;
    var out = el('output', { 'aria-live': 'off' });
    var ticks = el('div', { class: 'ticks' });
    ticks.style.width = (count * GAP + 2) + 'px';
    // Long ticks and their numbers sit on round values (15, 20, 25), wherever the range starts.
    var every = major * step;
    var firstMajor = Math.round((Math.ceil(min / every - 1e-9) * every - min) / step);
    ticks.style.backgroundSize = (major * GAP) + 'px 38px, ' + GAP + 'px 22px';
    ticks.style.backgroundPosition = (firstMajor * GAP - 1) + 'px 0, -.5px 0';
    for (var k = firstMajor; k <= count; k += major) {
      var mark = el('span', { text: Number(min + k * step).toLocaleString(t('locale'), { maximumFractionDigits: decimals(q) }) });
      mark.style.left = (k * GAP) + 'px';
      ticks.appendChild(mark);
    }
    var scroller = el('div', { class: 'scroller', tabindex: '0', role: 'slider', 'aria-label': title(q),
      'aria-valuemin': String(min), 'aria-valuemax': String(max) },
      [el('div', { class: 'pad' }), ticks, el('div', { class: 'pad' })]);
    var settle = null, programmatic = false;
    function indexOf(value) { return Math.max(0, Math.min(count, Math.round((value - min) / step))); }
    function paint() {
      var words = shownNumber(q, a.v);
      out.textContent = words;
      out.className = words.length >= 5 ? 'l5' : words.length === 4 ? 'l4' : '';
      scroller.setAttribute('aria-valuenow', String(a.v));
      scroller.setAttribute('aria-valuetext', words + ' ' + unit(q));
    }
    function set(index, smooth) {
      index = Math.max(0, Math.min(count, index));
      a.v = Number((min + index * step).toFixed(decimals(q)));
      a.skipped = false;
      paint(); save();
      programmatic = true;
      scroller.scrollTo({ left: index * GAP, behavior: smooth ? 'smooth' : 'auto' });
      clearTimeout(settle);
      settle = setTimeout(function () { programmatic = false; }, 360);
    }
    // Only the person moves the value: a scroll that no touch, wheel or key started is ignored.
    var byHand = false;
    ['pointerdown', 'touchstart', 'wheel'].forEach(function (type) {
      scroller.addEventListener(type, function () { byHand = true; programmatic = false; }, { passive: true });
    });
    scroller.addEventListener('scroll', function () {
      if (programmatic || !byHand) return;
      var index = Math.max(0, Math.min(count, Math.round(scroller.scrollLeft / GAP)));
      var value = Number((min + index * step).toFixed(decimals(q)));
      if (value !== a.v) { a.v = value; a.skipped = false; paint(); tick(); }
      clearTimeout(settle);
      settle = setTimeout(function () {
        save();
        if (Math.abs(scroller.scrollLeft - index * GAP) > .5) scroller.scrollTo({ left: index * GAP, behavior: 'smooth' });
      }, 140);
    }, { passive: true });
    scroller.addEventListener('keydown', function (e) {
      var move = { ArrowLeft: -1, ArrowDown: -1, ArrowRight: 1, ArrowUp: 1, PageDown: -10, PageUp: 10 }[e.key];
      if (e.key === 'Home') { e.preventDefault(); set(0, true); }
      else if (e.key === 'End') { e.preventDefault(); set(count, true); }
      else if (move) { e.preventDefault(); set(indexOf(a.v) + move, true); }
    });
    paint();
    // Put the ruler on the value as soon as it is laid out (a hidden tab holds animation frames back).
    var placed = false;
    var place = function () { if (!placed && scroller.isConnected) { placed = true; set(indexOf(a.v), false); } };
    requestAnimationFrame(place);
    setTimeout(place, 80);
    return el('div', { class: 'control' }, [
      el('div', { class: 'num' }, [out]),
      el('div', { class: 'unit', text: unit(q) }),
      el('div', { class: 'ruler' }, [scroller])
    ]);
  }

  /** A single tap answers the question: move on, unless this is the last screen (never send on one tap). */
  function autoForward() {
    if (S.at !== FINAL && SCREENS[S.at] && SCREENS[S.at].length === 1) setTimeout(forward, calm ? 0 : 260);
  }

  function controlFor(q) {
    var a = answer(q);
    if (q.type === 'text') {
      var input = el('input', { class: 'field', type: 'text', maxlength: q.cfg.maxlen || '60', value: a.v,
        placeholder: hint(q), 'aria-label': title(q), autocomplete: 'name', autocapitalize: 'words', enterkeyhint: 'next',
        oninput: function (e) { a.v = e.target.value; save(); refreshDock(); },
        onkeydown: function (e) { if (e.key === 'Enter') forward(); } });
      setTimeout(function () { try { input.focus({ preventScroll: true }); } catch (e) {} }, 380);
      return el('div', { class: 'control' }, [input]);
    }
    if (q.type === 'number') return numberControl(q, a);
    if (q.type === 'single') {
      return el('div', { class: 'control' }, [listControl(q, q.options, false, function () { return [a.v]; },
        function (value) { a.v = value; save(); autoForward(); })]);
    }
    if (q.type === 'yesno') {
      var inner = el('div', {}, [el('p', { class: 'sub', text: t('which') })]);
      if (q.options.length) {
        inner.appendChild(listControl(q, q.options, true, function () { return a.v; },
          function (value) { toggle(a.v, value); save(); }));
      }
      var more = el('div', { class: 'more' }, [inner]);
      var open = function (on) { more.classList.toggle('open', on); more.inert = !on; };
      open(a.yes === true);
      var yn = [{ v: 'no', tr: UI.tr.no, en: UI.en.no, ar: UI.ar.no }, { v: 'yes', tr: UI.tr.yes, en: UI.en.yes, ar: UI.ar.yes }];
      return el('div', { class: 'control' }, [
        listControl(q, yn, false, function () { return a.yes === null ? [] : [a.yes ? 'yes' : 'no']; }, function (value) {
          a.yes = value === 'yes';
          save();
          open(a.yes);
          if (!a.yes) return autoForward();
          setTimeout(function () {
            try { more.scrollIntoView({ block: 'nearest', behavior: calm ? 'auto' : 'smooth' }); } catch (e) {}
          }, calm ? 0 : 440);
        }),
        more
      ]);
    }
    if (q.type === 'dates' || q.cfg.look === 'days') {
      var rec = recommended(q);
      var days = q.type === 'dates' ? dayList(q) : q.options.map(function (o) {
        return { v: o.v, short: (S.lang === 'tr' ? o.shortTr : S.lang === 'ar' ? o.shortAr : o.shortEn) || label(o).slice(0, 3), full: label(o),
          rec: rec.indexOf(o.v) !== -1 };
      });
      return el('div', { class: 'control' }, [daysControl(q, days, function () { return a.v; },
        function (value) { toggle(a.v, value); save(); }, Number(q.cfg.min) || 1)]);
    }
    return el('div', { class: 'control' }, [listControl(q, q.options, true, function () { return a.v; },
      function (value) { toggle(a.v, value); save(); })]);
  }

  /** One screen: a single question, or a few short ones under one heading. */
  function questionScreen(group) {
    var first = group[0];
    if (group.length === 1) {
      var kids = [el('h1', { text: title(first), tabindex: '-1' })];
      if (hint(first) && first.type !== 'text') kids.push(el('p', { class: 'hint', text: hint(first) }));
      var control = controlFor(first);
      if (first.type === 'text') { control.style.marginTop = '28px'; control.style.paddingTop = '0'; }
      kids.push(control);
      return el('section', { class: 'screen' }, kids);
    }
    var stack = el('div', { class: 'control stack' });
    group.forEach(function (q) {
      stack.appendChild(el('div', { class: 'part' }, [
        el('p', { class: 'sub', text: q.cfg['short_' + S.lang] || q.cfg.short_tr || title(q) }), controlFor(q)]));
    });
    return el('section', { class: 'screen' }, [
      el('h1', { text: first.cfg['screen_' + S.lang] || first.cfg.screen_tr || title(first), tabindex: '-1' }), stack]);
  }

  /** A word as letters, so each one can land on its own. */
  function letters(word, from) {
    return word.split('').map(function (ch, index) {
      var span = el('span', { class: 'ch', text: ch });
      span.style.setProperty('--i', String(from + index));
      return span;
    });
  }
  function introScreen() {
    if (N === 0) return el('section', { class: 'screen intro' }, [el('h1', { text: t('empty'), tabindex: '-1' })]);
    var words = BRAND.split(/\s+/), at = 0;
    var mark = el('h1', { class: 'wordmark', tabindex: '-1', 'aria-label': BRAND });
    words.forEach(function (word, index) {
      var kids = index === 0 ? [el('span', { class: 'vm', html: ICON.brand })] : [];
      var shown = index === 0 && MARKED ? word.slice(1) : word;
      mark.appendChild(el('span', { class: 'l', 'aria-hidden': 'true' }, kids.concat(letters(shown, at))));
      at += word.length + 1;
    });
    return el('section', { class: 'screen intro' }, [
      mark,
      text('welcome_eyebrow') ? el('p', { class: 'eyebrow', text: text('welcome_eyebrow') }) : null,
      text('welcome_title') ? el('p', { class: 'promise', text: text('welcome_title') }) : null,
      el('p', { class: 'hint', text: text('welcome_body') })
    ]);
  }

  function screenOf(q) {
    for (var i = 0; i < SCREENS.length; i++) if (SCREENS[i].indexOf(q) !== -1) return i;
    return 0;
  }
  function reviewScreen() {
    var list = el('ul', { class: 'rows' });
    QUESTIONS.forEach(function (q, index) {
      list.appendChild(el('li', {}, [el('button', { class: 'row', type: 'button',
        onclick: function () { if (!S.sending) { S.toReview = true; go(screenOf(q), 'back'); } } }, [
        el('span', { class: 'q', text: title(q) }),
        el('span', { class: 'a', text: shown(q) || '–' }),
        el('span', { html: ICON.chevron })
      ])]));
    });
    return el('section', { class: 'screen' }, [
      el('h1', { text: t('reviewTitle'), tabindex: '-1' }),
      el('p', { class: 'hint', text: t('reviewHint') }),
      list
    ]);
  }

  function sentScreen() {
    var nameQ = QUESTIONS.filter(function (q) { return q.id === 'name'; })[0];
    var first = nameQ ? answer(nameQ).v.trim().split(/\s+/)[0] : '';
    var lines = text('before').split('\n').map(function (line) { return line.trim(); }).filter(String);
    var list = el('ol', {});
    lines.forEach(function (line) { list.appendChild(el('li', { text: line })); });
    return el('section', { class: 'screen sent' }, [
      el('div', { html: ICON.tick }),
      el('h1', { text: (first ? t('thanks').replace('{name}', first) + ' ' : '') + (text('sent_title') || t('thanksPlain')), tabindex: '-1' }),
      text('sent_body') ? el('p', { class: 'hint', text: text('sent_body') }) : null,
      lines.length ? el('h2', { text: text('before_heading') }) : null,
      lines.length ? list : null
    ]);
  }

  // MARK: Moving between screens

  function refreshDock() {
    var group = SCREENS[S.at];
    var q = group && group.length === 1 ? group[0] : null;
    dock.hidden = S.sent || N === 0;
    backBtn.hidden = S.at <= FIRST || S.sent || S.sending;
    backBtn.setAttribute('aria-label', t('back'));
    progress.hidden = S.at === -1 || S.sent || N === 0;
    lockup.hidden = S.at === -1 && !S.sent;
    progress.setAttribute('aria-label', t('progress'));
    var share = N ? Math.max(0, Math.min(1, (S.at + 1) / (FINAL + 1))) : 0;
    progress.firstElementChild.style.transform = 'scaleX(' + share + ')';
    progress.setAttribute('aria-valuenow', String(Math.round(share * 100)));
    langBtn.innerHTML = ICON.globe + '<span>' + S.lang.toUpperCase() + '</span>' + ICON.updown;
    langBtn.setAttribute('aria-label', t('language'));
    Array.prototype.forEach.call(langMenu.querySelectorAll('button'), function (button) {
      if (!button.lastElementChild) button.insertAdjacentHTML('beforeend', ICON.check);
      button.setAttribute('aria-checked', String(button.getAttribute('data-l') === S.lang));
    });
    langBox.hidden = S.sending && !S.sent;
    errorBox.hidden = !(S.failed && S.at === FINAL);
    errorBox.textContent = t('fail');
    skipBtn.hidden = !(q && q.type === 'number' && q.cfg.skip === 'yes');
    skipBtn.textContent = t('skip');
    var words = S.sending ? t('sending')
      : S.at === -1 ? text('welcome_cta') || t('start') : S.at === FINAL ? (S.failed ? t('retry') : t('send')) : S.toReview ? t('done') : t('next');
    var was = nextBtn.getAttribute('data-words');
    nextBtn.textContent = '';
    if (S.sending) nextBtn.appendChild(el('span', { class: 'spin' }));
    nextBtn.appendChild(el('span', { class: 'lbl' + (was && was !== words ? ' new' : ''), text: words }));
    nextBtn.setAttribute('data-words', words);
    nextBtn.disabled = S.sending || (group ? !group.every(valid) : false);
    document.documentElement.lang = S.lang;
    document.documentElement.dir = S.lang === 'ar' ? 'rtl' : 'ltr';
    if (S.lang === 'ar') arabicFace();
  }
  /** Each part of an arriving screen lands in turn: the heading, the line under it, then the answers. */
  function stagger(screen, base) {
    var at = 0;
    Array.prototype.forEach.call(screen.querySelectorAll(
      'h1:not(.wordmark), .eyebrow, .promise, .hint, .meta, .num, .unit, .ruler, .item, .days, .rec-note, .count, .field, .tick, h2, ol > li, .rows, .part > .sub'
    ), function (node) {
      if (node.closest('.more')) return;
      node.classList.add('land');
      node.style.setProperty('--d', (base + (at < 2 ? at * 60 : Math.min(120 + (at - 2) * 40, 520))) + 'ms');
      at += 1;
    });
  }
  var current = null;
  /** Puts a screen on the stage. `direction`: fwd, back, first (the page opening), swap (language), or none. */
  function draw(direction) {
    var screen = S.sent ? sentScreen() : S.at === -1 || N === 0 ? introScreen() : S.at === N ? reviewScreen() : questionScreen(SCREENS[S.at]);
    var old = current;
    Array.prototype.slice.call(stage.children).forEach(function (node) { if (node !== old) stage.removeChild(node); });
    if (old && direction && direction !== 'first') {
      old.className = old.className.replace(/\b(fwd|back|first|swap)\b/g, '') + ' leave leave-' + direction;
      old.setAttribute('aria-hidden', 'true');
      old.inert = true;
      setTimeout(function () { if (old.parentNode) old.parentNode.removeChild(old); }, direction === 'swap' ? 130 : 210);
    } else if (old && old.parentNode) {
      stage.removeChild(old);
    }
    if (direction) screen.classList.add(direction);
    if (direction && direction !== 'swap') stagger(screen, direction === 'first' ? (S.at === -1 ? 1000 : 120) : old ? 90 : 0);
    stage.appendChild(screen);
    current = screen;
    refreshDock();
    return screen;
  }
  /** Redraws the same screen (the language changed); `keepScroll` holds the place in a long list. */
  function redraw(keepScroll, direction) {
    var top = keepScroll && current ? current.scrollTop : 0;
    var screen = draw(direction || null);
    if (keepScroll) screen.scrollTop = top;
  }
  function go(index, direction) {
    S.at = index;
    S.failed = false;
    save();
    var screen = draw(direction);
    var head = screen.querySelector('h1');
    if (head && !screen.querySelector('input.field')) { try { head.focus({ preventScroll: true }); } catch (e) {} }
  }
  function forward() {
    if (S.sending || S.sent || N === 0) return;
    var group = SCREENS[S.at];
    if (group && !group.every(valid)) return;
    if (S.at === FINAL) return send();
    if (S.toReview) { S.toReview = false; return go(N, 'fwd'); }
    go(S.at + 1, 'fwd');
  }
  function backward() {
    if (S.sending || S.sent || S.at <= FIRST) return;
    if (S.toReview) { S.toReview = false; return go(N, 'fwd'); }
    go(S.at - 1, 'back');
  }

  /**
   * The thank-you screen comes at once and the answers travel behind it (the sheet takes a few seconds to
   * answer). They stay saved on this phone until the sheet confirms, the browser finishes the request even if
   * the page is closed, and a failed try is repeated; the sheet writes a repeated submission once. If it still
   * fails, the person is brought back to the last question with the reason and a retry.
   */
  function send() {
    var answers = {};
    QUESTIONS.forEach(function (q) { answers[q.id] = cell(q); });
    var body = JSON.stringify({ fn: 'submitIntake', payload: { code: BOOT.code || '', lang: S.lang, ref: S.ref, answers: answers } });
    var tries = 0, settled = false;
    S.sent = true; S.sending = true; S.failed = false;
    var head = draw('fwd').querySelector('h1');
    if (head) { try { head.focus({ preventScroll: true }); } catch (e) {} }
    function done(ok) {
      if (settled) return;
      if (!ok && tries < 3) return attempt();
      settled = true;
      S.sending = false;
      if (ok) {
        try { localStorage.removeItem(STORE); } catch (e) {}
        refreshDock();
      } else {
        S.sent = false; S.failed = true;
        draw('back');
      }
    }
    function attempt() {
      tries += 1;
      var over = false;
      var finish = function (ok, wait) {
        if (over) return;
        over = true;
        clearTimeout(timer);
        setTimeout(function () { done(ok); }, wait || 0);
      };
      var timer = setTimeout(function () { finish(false); }, 30000);
      if (query.mock) {
        // A preview: nothing is sent anywhere.
        return setTimeout(function () { finish(!query.fail); }, 900);
      }
      fetch(API, { method: 'POST', credentials: 'omit', keepalive: true, body: body })
        .then(function (response) { return response.json(); })
        .then(function (result) { finish(!!(result && result.ok)); })
        .catch(function () { finish(false, 1500); });
    }
    attempt();
  }

  document.onkeydown = function (e) {
    var tag = e.target && e.target.tagName;
    if (e.key === 'Escape') return menu(false);
    if (e.key === 'Enter' && tag !== 'BUTTON' && tag !== 'TEXTAREA' && tag !== 'INPUT') forward();
  };
  nextBtn.onclick = forward;
  backBtn.onclick = backward;
  skipBtn.onclick = (function () {
    var q = SCREENS[S.at] && SCREENS[S.at][0];
    if (!q) return;
    answer(q).skipped = true;
    save();
    forward();
  });
  /** Arabic is set in Cairo, the app's Arabic face; it is fetched only when Arabic is picked. */
  function arabicFace() {
    if (document.getElementById('cairo')) return;
    var link = el('link', { id: 'cairo', rel: 'stylesheet',
      href: 'https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&display=swap' });
    document.head.appendChild(link);
  }
  function menu(open) {
    langMenu.classList.toggle('open', open);
    langMenu.inert = !open;
    veil.hidden = !open;
    langBtn.setAttribute('aria-expanded', String(open));
    if (open) tick();
  }
  menu(false);
  langBtn.onclick = function () { menu(!langMenu.classList.contains('open')); };
  veil.onclick = function () { menu(false); };
  Array.prototype.forEach.call(langMenu.querySelectorAll('button'), function (button) {
    button.onclick = function () {
      var to = button.getAttribute('data-l');
      menu(false);
      if (to === S.lang) return;
      S.lang = to;
      if (!S.sent || S.sending) {
        try { localStorage.setItem(STORE, JSON.stringify({ answers: S.answers, lang: S.lang, at: S.at, ref: S.ref })); } catch (e) {}
      }
      // The menu folds away first, then the screen's words change.
      setTimeout(function () { redraw(true, 'swap'); }, calm ? 0 : 140);
    };
  });
  draw(opening ? 'first' : null);
  }

  // The built-in default set opens at once. The sheet's live set (or a coded link's own set) replaces it when it
  // arrives, unless the person has already started answering.
  var code = /^[a-z0-9]{4,12}$/.test(query.c || '') ? query.c : '';
  var started = false;
  function begin(boot) { start(boot, !started); started = true; }
  if (!code && FALLBACK) begin(FALLBACK);
  if (query.mock) { if (!started) begin(FALLBACK); return; }
  var giveUp = setTimeout(function () { if (!started) begin(FALLBACK || { code: '', questions: [], texts: {} }); }, 7000);
  fetch(API + '?api=boot' + (code ? '&c=' + encodeURIComponent(code) : ''), { credentials: 'omit' })
    .then(function (response) { return response.json(); })
    .then(function (live) {
      clearTimeout(giveUp);
      if (!live || !live.questions) throw new Error('no questions');
      // The sheet's food list is replaced by the script's next version; until then its old list (red meat, fish,
      // cheese) gives way to the built-in one.
      if (FALLBACK) {
        live.questions = live.questions.map(function (q) {
          if (q.id !== 'foods' || !/(^|\n)beef \|/.test(q.options || '')) return q;
          return FALLBACK.questions.filter(function (f) { return f.id === 'foods'; })[0] || q;
        });
      }
      var same = FALLBACK && JSON.stringify(live.questions) === JSON.stringify(FALLBACK.questions)
        && JSON.stringify(live.texts) === JSON.stringify(FALLBACK.texts) && !live.code;
      if (!started || (!touched && !same)) begin(live);
    })
    .catch(function () { clearTimeout(giveUp); if (!started) begin(FALLBACK || { code: '', questions: [], texts: {} }); });
})();
</script>
</body>
