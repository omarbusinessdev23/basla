<!doctype html>
<html lang="tr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Intake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..110,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F3F1EC;
    --ink: #0C0C0D;
    --muted: #5B5852;
    --line: rgba(12, 12, 13, .14);
    --fill: rgba(12, 12, 13, .06);
    --fill-press: rgba(12, 12, 13, .11);
    --tick: rgba(12, 12, 13, .34);
    --accent: #0C0C0D;
    --on-accent: #F3F1EC;
    --error: #B3261E;
    --ease: cubic-bezier(.16, 1, .3, 1);
    --font: "Archivo", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0B0B0C; --ink: #F3F1EC; --muted: #A5A199; --line: rgba(243, 241, 236, .16);
      --fill: rgba(243, 241, 236, .09); --fill-press: rgba(243, 241, 236, .16);
      --tick: rgba(243, 241, 236, .4); --error: #FF8A7A; --accent: #F3F1EC; --on-accent: #0B0B0C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0B0B0C; --ink: #F3F1EC; --muted: #A5A199; --line: rgba(243, 241, 236, .16);
    --fill: rgba(243, 241, 236, .09); --fill-press: rgba(243, 241, 236, .16);
    --tick: rgba(243, 241, 236, .4); --error: #FF8A7A; --accent: #F3F1EC; --on-accent: #0B0B0C;
      color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 17px; line-height: 1.45;
    font-variation-settings: "wdth" 100; -webkit-font-smoothing: antialiased; overflow: hidden;
    overscroll-behavior: none;
  }
  ::selection { background: var(--accent); color: var(--on-accent); }
  button, input { font: inherit; color: inherit; }
  button { background: none; border: 0; padding: 0; cursor: pointer; touch-action: manipulation; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  h1:focus { outline: none; }

  #app { height: 100vh; height: 100dvh; max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; }

  /* Top bar: back, progress, language */
  .bar { display: flex; align-items: center; gap: 4px; padding: 6px 8px 0; min-height: 56px; }
  .icon-btn { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; flex: none; }
  .icon-btn:active { background: var(--fill); }
  .icon-btn svg { width: 22px; height: 22px; }
  .icon-btn[hidden] { display: grid; visibility: hidden; }
  .progress { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 100%; background: var(--accent); transform-origin: left;
    transform: scaleX(0); transition: transform .5s var(--ease); }
  .progress[hidden] { display: block; visibility: hidden; }
  .lang { min-width: 44px; height: 44px; padding: 0 12px; font-size: 14px; font-weight: 650; letter-spacing: .04em;
    color: var(--muted); border-radius: 22px; flex: none; }
  .lang:active { background: var(--fill); }

  /* Stage: one screen at a time */
  #stage { flex: 1; min-height: 0; position: relative; }
  .screen { position: absolute; inset: 0; overflow-y: auto; overflow-x: hidden; display: flex; flex-direction: column;
    padding: 20px 24px 16px; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .screen.fwd { animation: in-fwd .34s var(--ease) both; }
  .screen.back { animation: in-back .34s var(--ease) both; }
  @keyframes in-fwd { from { opacity: 0; transform: translateX(28px); } }
  @keyframes in-back { from { opacity: 0; transform: translateX(-28px); } }

  h1 { margin: 0; font-size: 30px; line-height: 1.1; font-weight: 700; letter-spacing: -.02em; text-wrap: balance; }
  .hint { margin: 10px 0 0; color: var(--muted); font-size: 16px; text-wrap: pretty; }
  .control { margin-top: auto; padding-top: 28px; }

  /* Intro */
  .intro h1 { font-size: 40px; line-height: 1.02; letter-spacing: -.03em; font-variation-settings: "wdth" 92; }
  .intro .hint { font-size: 18px; margin-top: 16px; max-width: 30ch; }
  .intro .mark { margin-top: auto; width: 56px; height: 4px; background: var(--accent); border-radius: 2px; }
  .intro .head { margin-top: 20px; }

  /* Choices: full-width rows that fill when picked, a check at the trailing edge */
  .list { display: grid; gap: 8px; }
  .item { width: 100%; min-height: 56px; padding: 12px 18px; border-radius: 16px; background: var(--fill);
    display: flex; align-items: center; justify-content: space-between; gap: 14px; text-align: left;
    font-size: 17px; font-weight: 560; line-height: 1.25;
    transition: background .18s ease, color .18s ease, transform .2s var(--ease); }
  .item:active { transform: scale(.98); background: var(--fill-press); }
  .item .lbl { display: block; }
  .item small { display: block; font-size: 14px; font-weight: 450; opacity: .7; margin-top: 1px; }
  .item .mark { flex: none; width: 22px; height: 22px; opacity: 0; transform: scale(.5);
    transition: opacity .14s ease, transform .3s var(--ease); }
  .item .mark svg { width: 22px; height: 22px; display: block; }
  .item[aria-checked="true"], .item[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .item[aria-checked="true"] .mark, .item[aria-pressed="true"] .mark { opacity: 1; transform: none; }
  .list.dense .item { min-height: 50px; padding: 10px 18px; }

  /* Days: seven circles in a row; a week strip carries the date under the weekday */
  .days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin: 0 -4px; }
  .day { aspect-ratio: 1; min-height: 44px; border-radius: 50%; background: var(--fill); display: grid;
    place-items: center; font-size: 14px; font-weight: 620; line-height: 1;
    transition: background .18s ease, color .18s ease, transform .2s var(--ease); }
  .day:active { transform: scale(.92); background: var(--fill-press); }
  .day[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
  .days.strip .day { aspect-ratio: auto; border-radius: 16px; min-height: 68px; padding: 10px 0; align-content: center;
    gap: 6px; }
  .days.strip .day b { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .days.strip .day span { font-size: 12px; font-weight: 560; opacity: .7; }
  .count { margin: 14px 0 0; text-align: center; font-size: 14px; font-weight: 560; color: var(--muted);
    font-variant-numeric: tabular-nums; }
  .list.cols { grid-template-columns: 1fr 1fr; }
  .list.cols .item { min-height: 50px; padding: 10px 14px; font-size: 16px; gap: 8px; }
  .list.cols .item .mark, .list.cols .item .mark svg { width: 18px; height: 18px; }

  /* Several short questions on one screen */
  .stack { display: grid; grid-template-columns: minmax(0, 1fr); gap: 26px; }
  .part .list .item { min-height: 48px; padding: 8px 16px; }
  .part .control { margin-top: 0; padding-top: 0; }
  .part > .sub { margin: 0 0 10px; font-size: 15px; font-weight: 650; color: var(--muted); }
  .part .num output { font-size: 46px; }
  .part .num output.l4 { font-size: 42px; }
  .part .num output.l5 { font-size: 36px; }
  .part .step { width: 44px; height: 44px; }
  .part .unit { display: none; }
  .part .ruler { margin-top: 8px; height: 64px; }
  .part .ruler::after { top: -2px; height: 40px; }
  .part .ticks span { top: 42px; }
  .more { margin-top: 22px; }
  .more[hidden] { display: none; }
  .more .sub { margin: 0 0 10px; font-size: 14px; font-weight: 650; color: var(--muted); }

  /* Typed fields: the name, and optional notes */
  .field { width: 100%; background: none; border: 0; border-bottom: 2px solid var(--line); border-radius: 0;
    padding: 10px 0 12px; font-size: 28px; font-weight: 650; letter-spacing: -.01em; caret-color: var(--accent);
    outline: none; transition: border-color .2s ease; }
  .field:focus { border-bottom-color: var(--accent); }
  .field::placeholder { color: var(--muted); opacity: .75; font-weight: 500; }
  .field.note { font-size: 17px; font-weight: 500; margin-top: 18px; letter-spacing: 0; }

  /* Number: big numeral, steppers, ruler */
  .num { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .num output { flex: 1; text-align: center; font-weight: 750; letter-spacing: -.03em; line-height: 1;
    font-variation-settings: "wdth" 84; font-variant-numeric: tabular-nums; font-size: 84px; }
  .num output.l4 { font-size: 72px; }
  .num output.l5 { font-size: 58px; }
  .step { width: 52px; height: 52px; border-radius: 50%; background: var(--fill); display: grid; place-items: center;
    flex: none; transition: transform .16s var(--ease), background .16s ease; }
  .step:active { transform: scale(.92); background: var(--fill-press); }
  .step svg { width: 22px; height: 22px; }
  .unit { text-align: center; color: var(--muted); font-size: 16px; font-weight: 560; margin-top: 6px; }
  .ruler { position: relative; margin: 26px -24px 0; height: 84px; }
  .ruler::after { content: ""; position: absolute; left: 50%; top: -6px; width: 3px; height: 54px; margin-left: -1.5px;
    background: var(--accent); border-radius: 2px; pointer-events: none; }
  .scroller { height: 100%; overflow-x: scroll; overflow-y: hidden; display: flex; scrollbar-width: none;
    -webkit-overflow-scrolling: touch; cursor: grab;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 22%, #000 78%, transparent);
    mask-image: linear-gradient(to right, transparent, #000 22%, #000 78%, transparent); }
  .scroller::-webkit-scrollbar { display: none; }
  .scroller > .pad { flex: 0 0 50%; }
  .ticks { flex: none; position: relative; height: 100%;
    background-image: linear-gradient(to right, var(--ink) 0 2px, transparent 2px),
      linear-gradient(to right, var(--tick) 0 1px, transparent 1px);
    background-repeat: repeat-x; background-position: -1px 0, -.5px 0; }
  .ticks span { position: absolute; top: 48px; transform: translateX(-50%); font-size: 13px; font-weight: 560;
    color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }

  /* Review */
  .rows { margin: 22px 0 0; padding: 0; list-style: none; }
  .rows li + li { border-top: 1px solid var(--line); }
  .row { width: 100%; text-align: left; padding: 14px 0; display: grid; grid-template-columns: 1fr 20px; gap: 2px 12px;
    align-items: center; }
  .row .q { grid-column: 1; font-size: 13.5px; color: var(--muted); line-height: 1.3; }
  .row .a { grid-column: 1; font-size: 17px; font-weight: 600; line-height: 1.3; overflow-wrap: anywhere; }
  .row svg { grid-column: 2; grid-row: 1 / span 2; width: 18px; height: 18px; color: var(--muted); }
  .row:active { opacity: .6; }

  /* Sent */
  .sent .tick { width: 56px; height: 56px; margin-top: 8px; }
  .sent .tick path { stroke: var(--accent); stroke-width: 4; fill: none; stroke-linecap: round; stroke-linejoin: round;
    stroke-dasharray: 60; stroke-dashoffset: 60; animation: draw .7s .15s var(--ease) forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .sent h1 { margin-top: 20px; font-size: 34px; line-height: 1.05; font-variation-settings: "wdth" 92; }
  .sent h2 { margin: 36px 0 0; font-size: 15px; font-weight: 700; color: var(--muted); }
  .sent ol { margin: 6px 0 0; padding: 0; list-style: none; }
  .sent ol li { padding: 14px 0; font-size: 17px; text-wrap: pretty; }
  .sent ol li + li { border-top: 1px solid var(--line); }
  .sent .close { margin: 22px 0 8px; color: var(--muted); font-size: 16px; }

  /* Dock: the one main action, in thumb reach */
  .dock { padding: 8px 24px max(16px, env(safe-area-inset-bottom)); display: grid; gap: 4px; }
  .dock[hidden] { display: none; }
  .cta { height: 58px; border-radius: 18px; background: var(--accent); color: var(--on-accent); font-size: 18px;
    font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px;
    transition: transform .16s var(--ease), opacity .2s ease, background .2s ease, color .2s ease; }
  .cta:active:not(:disabled) { transform: scale(.98); }
  .cta:disabled { background: var(--fill); color: var(--muted); cursor: default; }
  .cta .spin { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid currentColor;
    border-right-color: transparent; animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .ghost { height: 46px; font-size: 16px; font-weight: 600; color: var(--muted); border-radius: 14px; }
  .ghost:active { background: var(--fill); }
  .ghost[hidden] { display: none; }
  .error { margin: 0 0 8px; color: var(--error); font-size: 15px; font-weight: 560; text-wrap: pretty; }
  .error[hidden] { display: none; }

  @media (max-height: 620px) {
    h1 { font-size: 26px; } .intro h1 { font-size: 34px; } .num output { font-size: 68px; }
    .control { padding-top: 18px; } .ruler { margin-top: 16px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .screen.fwd, .screen.back { animation: fade .2s ease both; }
    @keyframes fade { from { opacity: 0; } }
    .sent .tick path { animation: none; stroke-dashoffset: 0; }
    .progress i, .step, .cta, .item, .item .mark, .day { transition: none; }
  }
</style>
</head>

  // MARK: Screens

  /** A list of choices: full-width rows; the picked ones fill and show a check. */
  function listControl(q, options, multi, values, onPick) {

      var props = { class: 'item', type: 'button', onclick: function () { onPick(option.v); sync(); refreshDock(); } };
      if (!multi) props.role = 'radio';

    });

  /** Seven circles in a row (weekdays), or a week strip with the date (the days ahead). Pick several. */

    var count = el('p', { class: 'count', 'aria-live': 'polite' });

        onclick: function () { onPick(day.v); sync(); refreshDock(); } },

  /** A single tap answers the question: move on, unless this is the last screen (never send on one tap). */

  function controlFor(q) {

  /** One screen: a single question, or a few short ones under one heading. */

  // MARK: Moving between screens

        try { localStorage.removeItem(STORE); } catch (e) {}
        draw('fwd');
        var head = stage.querySelector('h1');
        if (head) { try { head.focus({ preventScroll: true }); } catch (e) {} }
      } else {
        S.failed = true;
        refreshDock();
      }
    }
    setTimeout(function () { done(false); }, 25000);
    if (query.mock) {
      // A preview: nothing is sent anywhere.
      var fail = query.fail && !send.tried;
      send.tried = true;
      setTimeout(function () { done(!fail); }, 900);
      return;
    }
    fetch(API, { method: 'POST', credentials: 'omit', body: JSON.stringify({ fn: 'submitIntake', payload: payload }) })
      .then(function (response) { return response.json(); })
      .then(function (result) { done(!!(result && result.ok)); })
      .catch(function () { done(false); });
  }

  nextBtn.onclick = forward;
  backBtn.onclick = backward;
  skipBtn.onclick = (function () {
    var q = SCREENS[S.at] && SCREENS[S.at][0];
    if (!q) return;
    answer(q).skipped = true;
    save();
    forward();
  });
  langBtn.onclick = function () {
    S.lang = S.lang === 'tr' ? 'en' : 'tr';
    try { localStorage.setItem(STORE, JSON.stringify({ answers: S.answers, lang: S.lang, at: S.at, ref: S.ref })); } catch (e) {}
    redraw(true);
  };
  draw(null);
  }

  // The built-in default set opens at once. The sheet's live set (or a coded link's own set) replaces it when it
  // arrives, unless the person has already started answering.
  var code = /^[a-z0-9]{4,12}$/.test(query.c || '') ? query.c : '';
  var started = false;
  function begin(boot) { started = true; start(boot); }
  if (!code && FALLBACK) begin(FALLBACK);
  if (query.mock) { if (!started) begin(FALLBACK); return; }
  var giveUp = setTimeout(function () { if (!started) begin(FALLBACK || { code: '', questions: [], texts: {} }); }, 7000);
  fetch(API + '?api=boot&c=' + encodeURIComponent(code), { credentials: 'omit' })
    .then(function (response) { return response.json(); })
    .then(function (live) {
      clearTimeout(giveUp);
      if (!live || !live.questions) throw new Error('no questions');
      var same = FALLBACK && JSON.stringify(live.questions) === JSON.stringify(FALLBACK.questions)
        && JSON.stringify(live.texts) === JSON.stringify(FALLBACK.texts) && !live.code;
      if (!started || (!touched && !same)) begin(live);
    })
    .catch(function () { clearTimeout(giveUp); if (!started) begin(FALLBACK || { code: '', questions: [], texts: {} }); });
})();
</script>
